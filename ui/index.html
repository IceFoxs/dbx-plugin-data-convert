    <script>
        // 首屏兜底：DBX 还没下发主题时先按宿主已注入的 theme（没有就看系统偏好）定暗/亮，
        // 免得暗色环境里先闪一帧白底。真正主题以宿主后续下发的为准。
        (function () {
            var root = document.documentElement;
            var hostTheme = window.dbxPlugin && window.dbxPlugin.theme;
            var dark;
            if (hostTheme && (hostTheme.appearance === 'dark' || hostTheme.appearance === 'light')) {
                dark = hostTheme.appearance === 'dark';
            } else {
                try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { dark = false; }
            }
            // 宿主令牌先落一份，首帧就是最终配色，不会先画默认白底再换肤
            if (hostTheme && hostTheme.tokens) {
                Object.keys(hostTheme.tokens).forEach(function (name) {
                    if (/^--(color|radius|font)-/.test(name) && typeof hostTheme.tokens[name] === 'string') {
                        root.style.setProperty(name, hostTheme.tokens[name]);
                    }
                });
            }
            root.setAttribute('data-dbx-theme', dark ? 'dark' : 'light');
        })();
    </script>

    <style>
        /* =========================================
           基于 DBX 设计令牌的主题样式
           ========================================= */
        :root {
            --bg-base: var(--color-background, #ffffff);
            --bg-card: var(--color-card, #ffffff);
            --text-main: var(--color-foreground, #09090b);
            --text-muted: var(--color-muted-foreground, #71717a);
            --border-light: var(--color-border, #e4e4e7);
            --primary: var(--color-primary, #18181b);
            --primary-text: var(--color-primary-foreground, #fafafa);
            --accent-bg: var(--color-muted, #f4f4f5);
            --accent-hover: var(--color-border, #e4e4e7);
            --radius-md: var(--radius-md, 0.5rem);
            --radius-lg: var(--radius-lg, 0.75rem);
            --font-sans: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif);
            --font-mono: var(--font-mono, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace);
            --scrollbar-track: rgba(0, 0, 0, 0.06);
            --scrollbar-thumb: rgba(100, 100, 100, 0.5);
            --scrollbar-thumb-hover: rgba(100, 100, 100, 0.8);
        }
        [data-dbx-theme="dark"] {
            /* 暗色下同样优先消费 DBX 注入的 --color-* 令牌，
               这样插件的深色和 DBX 当前皮肤（含暖色/自定义配色）保持一致，
               只有在宿主没注入令牌时才退回内置的冷灰暗色 */
            --bg-base: var(--color-background, #09090b);
            --bg-card: var(--color-card, #121214);
            --text-main: var(--color-foreground, #f4f4f5);
            --text-muted: var(--color-muted-foreground, #a1a1aa);
            --border-light: var(--color-border, #27272a);
            --accent-bg: var(--color-muted, #18181b);
            --accent-hover: var(--color-border, #27272a);
            --primary: var(--color-primary, #3b82f6);
            --primary-text: var(--color-primary-foreground, #ffffff);
            --scrollbar-track: rgba(255, 255, 255, 0.08);
            --scrollbar-thumb: rgba(200, 200, 200, 0.45);
            --scrollbar-thumb-hover: rgba(200, 200, 200, 0.75);
            color-scheme: dark;
        }
        [data-dbx-theme="light"] { color-scheme: light; }

        /* =========================================
           主题切换过渡
           把派生出来的颜色变量注册成 <color>，切换时让这些「变量本身」做动画。
           这样背景、正文、次要文字、边框、按钮都走同一根时间轴，
           不需要给每个元素挂 transition —— 给元素挂 color 过渡时，
           子元素会继承父元素正在动画的颜色、每帧重启自己的过渡，
           文字色会明显追不上（实测 300ms 只走了四分之一）。
           ========================================= */
        @property --bg-base { syntax: '<color>'; inherits: true; initial-value: #ffffff; }
        @property --bg-card { syntax: '<color>'; inherits: true; initial-value: #ffffff; }
        @property --text-main { syntax: '<color>'; inherits: true; initial-value: #09090b; }
        @property --text-muted { syntax: '<color>'; inherits: true; initial-value: #71717a; }
        @property --border-light { syntax: '<color>'; inherits: true; initial-value: #e4e4e7; }
        @property --accent-bg { syntax: '<color>'; inherits: true; initial-value: #f4f4f5; }
        @property --accent-hover { syntax: '<color>'; inherits: true; initial-value: #e4e4e7; }
        @property --primary { syntax: '<color>'; inherits: true; initial-value: #18181b; }
        @property --primary-text { syntax: '<color>'; inherits: true; initial-value: #fafafa; }

        :root {
            --theme-anim-dur: 300ms;
            --theme-anim-ease: cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* 只在切换的这 300ms 里挂动画，平时不挂，免得影响 hover 与首屏 */
        html.theme-anim {
            transition:
                --bg-base var(--theme-anim-dur) var(--theme-anim-ease),
                --bg-card var(--theme-anim-dur) var(--theme-anim-ease),
                --text-main var(--theme-anim-dur) var(--theme-anim-ease),
                --text-muted var(--theme-anim-dur) var(--theme-anim-ease),
                --border-light var(--theme-anim-dur) var(--theme-anim-ease),
                --accent-bg var(--theme-anim-dur) var(--theme-anim-ease),
                --accent-hover var(--theme-anim-dur) var(--theme-anim-ease),
                --primary var(--theme-anim-dur) var(--theme-anim-ease),
                --primary-text var(--theme-anim-dur) var(--theme-anim-ease);
        }
        /* 旧内核不认识 @property，变量就不会插值，等于没有动画，不会出现半套效果 */

        /* 切换期间把元素自身的 transition（很多是 all .15s 的 hover 动效）关掉：
           颜色已经由上面的变量动画驱动，再让元素自己追一次只会慢半拍。 */
        html.theme-anim *,
        html.theme-anim *::before,
        html.theme-anim *::after {
            transition: none !important;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        }
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
            background-color: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
            border: 2px solid var(--scrollbar-track);
            background-clip: content-box;
            transition: background 0.15s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
            border: 2px solid var(--scrollbar-track);
            background-clip: content-box;
        }
        ::-webkit-scrollbar-corner {
            background: var(--scrollbar-track);
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航栏布局修复 */
        .topbar {
            display: flex;
            align-items: center;
            padding: 0 1rem;
            height: 3.5rem;
            border-bottom: 1px solid var(--border-light);
            background-color: var(--bg-base);
            flex-shrink: 0;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
            white-space: nowrap;
            flex-shrink: 0;
            margin-right: 1rem;
        }
        .brand svg { color: var(--primary); }

        /* 中间导航链接：装不下的项收进右侧「更多」，不再横向滚动 */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            height: 100%;
        }
        .nav-links a {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-md);
            transition: all 0.15s ease;
            font-weight: 500;
            flex-shrink: 0;
            line-height: 1.2;
        }
        .nav-links a:hover {
            color: var(--text-main);
            background-color: var(--accent-bg);
        }
        /* 一项都放不下时不要让空容器继续占位 */
        .nav-links.is-empty { flex: 0 0 0; }

        /* 导航「更多」下拉：只在真的装不下时出现 */
        .nav-more {
            position: relative;
            flex-shrink: 0;
            display: none;
            align-items: center;
            margin-left: 0.25rem;
        }
        .nav-more.show { display: flex; }
        .nav-more-trigger {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.4rem 0.6rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            background-color: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.8125rem;
            font-weight: 500;
            line-height: 1.2;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .nav-more-trigger:hover,
        .nav-more.open .nav-more-trigger {
            color: var(--text-main);
            background-color: var(--accent-bg);
        }
        .nav-more-trigger svg {
            width: 0.85rem;
            height: 0.85rem;
            color: var(--text-muted);
            transition: transform 0.15s ease;
        }
        .nav-more.open .nav-more-trigger svg { transform: rotate(180deg); }
        .nav-more-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 10.5rem;
            max-width: 16rem;
            max-height: 60vh;
            overflow-y: auto;
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            padding: 0.35rem;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav-more.open .nav-more-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .nav-more-menu a {
            display: block;
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius-md);
            font-size: 0.825rem;
            font-weight: 500;
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-color 0.1s;
        }
        .nav-more-menu a:hover { background-color: var(--accent-bg); }
        .nav-more-menu a.active {
            color: var(--primary);
            background-color: var(--accent-bg);
        }

        /* 右侧语言切换器 */
        .lang-switcher {
            position: relative;
            flex-shrink: 0;
            margin-left: 1rem;
        }
        .lang-trigger {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            background-color: transparent;
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.15s;
        }
        .lang-trigger:hover { background-color: var(--accent-bg); }
        .lang-trigger svg { width: 1rem; height: 1rem; color: var(--text-muted); }
        .lang-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 200px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            padding: 0.35rem;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 400px;
            overflow-y: auto;
        }
        .lang-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .lang-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background-color 0.1s;
            color: var(--text-main);
        }
        .lang-option:hover { background-color: var(--accent-bg); }
        .lang-option.selected {
            color: var(--primary);
            font-weight: 600;
            background-color: var(--accent-bg);
        }
        .lang-option-left { display: flex; align-items: center; gap: 0.5rem; }
        .lang-option-left span.flag { font-size: 1.1rem; }

        .main-container {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            overflow: hidden;
            gap: 1rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background-color: var(--bg-card);
            padding: 0.6rem 1.25rem;
            border-radius: 9999px;
            border: 1px solid var(--border-light);
            align-self: center;
            flex-shrink: 0;
            max-width: 100%;
            flex-wrap: nowrap;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        /* 工具栏里的主按钮：不参与拉伸，保持胶囊造型 */
        .toolbar .btn-primary {
            flex: 0 0 auto;
            width: auto;
            padding: 0.45rem 1rem;
            border-radius: 9999px;
            gap: 0.4rem;
        }
        .select-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
            position: relative;
        }
        .custom-select-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 100px;
            background-color: var(--accent-bg);
            border: 1px solid transparent;
            padding: 0.4rem 0.75rem;
            font-size: 0.85rem;
            border-radius: var(--radius-md);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s ease;
            user-select: none;
        }
        .custom-select-trigger:hover { background-color: var(--accent-hover); }
        .custom-select-trigger.active { border-color: var(--primary); outline: none; }
        .custom-select-trigger svg { width: 0.9rem; height: 0.9rem; color: var(--text-muted); transition: transform 0.2s ease; }
        .custom-select-trigger.active svg { transform: rotate(180deg); }
        .custom-select-options {
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) scaleY(0.95);
            min-width: 130px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            padding: 0.35rem;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transform-origin: top center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .custom-select-options.open {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scaleY(1);
        }
        .custom-option {
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--text-main);
            transition: background-color 0.1s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .custom-option:hover { background-color: var(--accent-hover); }
        .custom-option.selected { background-color: var(--accent-bg); color: var(--primary); font-weight: 600; }
        .custom-option.selected::after { content: '✓'; font-size: 0.9rem; }
        .swap-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            background-color: var(--primary);
            border: none;
            color: var(--primary-text);
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.4);
        }
        .swap-btn:hover { opacity: 0.9; transform: rotate(180deg) scale(1.05); }
        .swap-btn svg { width: 1.1rem; height: 1.1rem; }

        /* 左右两栏严格等高：桌面端一行两列，窄屏两行两列，行高都锁在可用空间内 */
        .workspace-grid {
            flex: 1 1 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: minmax(0, 1fr);
            gap: 1.25rem;
            min-height: 0;
            overflow: hidden;
        }
        .pane {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }
        .pane-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            padding: 0 0.25rem;
            min-height: 1.75rem;
            gap: 0.5rem;
            overflow: hidden;
        }
        .pane-title {
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-main);
            white-space: nowrap;
            min-width: 0;
            overflow: hidden;
        }
        .pane-title > span[data-i18n] { overflow: hidden; text-overflow: ellipsis; }
        .pane-title svg { color: var(--text-muted); }
        .pane-badge {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            padding: 0.1rem 0.4rem;
            border-radius: 9999px;
            background-color: var(--accent-bg);
            color: var(--text-muted);
        }
        .pane-actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
        .editor-container {
            flex: 1 1 0;
            min-height: 0;
            position: relative;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-card);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .editor-container:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }
        .textarea {
            width: 100%;
            flex: 1 1 0;
            min-height: 0;
            padding: 1.25rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text-main);
            background-color: var(--bg-card);
            border: none;
            outline: none;
            resize: none;
            tab-size: 2;
        }
        .textarea::-webkit-scrollbar {
            width: 12px;
            height: 12px;
            background: var(--scrollbar-track);
        }
        .textarea::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 12px;
            border: 3px solid var(--scrollbar-track);
            background-clip: content-box;
        }
        .textarea::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
            border: 3px solid var(--scrollbar-track);
            background-clip: content-box;
        }

        /* =========================================
           CodeMirror 5 适配样式
           ========================================= */
        .editor-container .CodeMirror {
            /* 容器是定高 flex 列，编辑器只占剩余空间，绝不能按内容撑高 */
            height: 100%;
            flex: 1 1 0;
            min-height: 0;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 1.7;
            background-color: var(--bg-card);
            color: var(--text-main);
        }
        .editor-container .CodeMirror-scroll {
            overflow: auto;
        }
        .editor-container .CodeMirror-gutters {
            background-color: var(--accent-bg);
            border-right: 1px solid var(--border-light);
        }
        .editor-container .CodeMirror-linenumber {
            color: var(--text-muted);
        }
        #outputEditorWrap .CodeMirror {
            background-color: var(--accent-bg);
        }
        /* 行号/折叠槽不要再单独吃主题里的硬编码底色（#f7f7f7 / #212121），
           否则换主题时编辑器底色在渐变、左边这条槽却硬切，会闪出一条缝 */
        .editor-container .CodeMirror .CodeMirror-gutters {
            background-color: transparent;
            border-right: 1px solid var(--border-light);
        }
        .editor-container textarea.textarea {
            display: none;
        }
        .CodeMirror-scroll::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }
        .CodeMirror-scroll::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 12px;
            border: 3px solid var(--scrollbar-track);
            background-clip: content-box;
        }
        .CodeMirror-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }
        /* CodeMirror 辅助插件样式微调 */
        .CodeMirror-activeline-background { background: rgba(59, 130, 246, 0.05) !important; }
        .editor-container .CodeMirror:not(.CodeMirror-focused) .CodeMirror-activeline-background {
            background: transparent !important;
        }
        .CodeMirror-matchingtag { background: rgba(59, 130, 246, 0.2) !important; }
        .CodeMirror-foldmarker { color: var(--primary); text-shadow: none; font-family: inherit; margin: 0 4px; cursor: pointer; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .btn svg { width: 0.9rem; height: 0.9rem; flex-shrink: 0; }
        .btn-primary {
            background-color: var(--text-main);
            color: var(--bg-card);
            flex: 1;
            padding: 0.6rem;
            font-size: 0.875rem;
            font-weight: 600;
        }
        .btn-primary:hover { opacity: 0.85; }
        .btn-outline {
            background-color: transparent;
            border-color: var(--border-light);
            color: var(--text-muted);
        }
        .btn-outline:hover {
            background-color: var(--accent-bg);
            color: var(--text-main);
            border-color: var(--accent-hover);
        }
        /* 输出格式徽标已并入 pane-header，原来的 result-header 行已移除，
           左右两栏因此行数对称，编辑器高度严格相等 */
        /* 解析错误提示：绝对定位浮在编辑器底部，出现/消失都不改变两栏高度 */
        .error-bar {
            position: absolute;
            left: 0.75rem;
            right: 0.75rem;
            bottom: 0.75rem;
            z-index: 5;
            display: none;
            align-items: baseline;
            gap: 0.5rem;
            padding: 0.45rem 0.7rem;
            border: 1px solid rgba(239, 68, 68, 0.45);
            border-radius: var(--radius-md);
            background-color: var(--bg-card);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            color: #b91c1c;
            font-size: 0.78rem;
            line-height: 1.45;
        }
        .error-bar.show { display: flex; }
        .error-bar .loc { font-weight: 600; flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .error-bar .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        [data-dbx-theme="dark"] .error-bar {
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.55);
        }
        .CodeMirror .cm-error-line { background-color: rgba(239, 68, 68, 0.14); }

        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: none;
        }
        .toast {
            background-color: var(--text-main);
            color: var(--bg-card);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            transition: opacity 0.3s, transform 0.3s;
        }
        .toast.error { background-color: #ef4444; color: #fff; }
        .toast.hide { opacity: 0; transform: translateX(100%); }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }

        /* ================= 对比模式相关样式 ================= */
        .diff-container {
            display: none;
            flex: 1 1 0;
            gap: 1.25rem;
            min-height: 0;
            position: relative;
        }
        .diff-container.active {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: minmax(0, 1fr);
        }
        .workspace-grid.hidden {
            display: none;
        }
        .CodeMirror .cm-inserted { background-color: rgba(34, 197, 94, 0.14); }
        .CodeMirror .cm-deleted { background-color: rgba(239, 68, 68, 0.14); }
        /* 结构化差异：只把「真正变了的那个值」标出来，不再整行划掉 */
        .CodeMirror .cm-value-changed { background-color: rgba(245, 158, 11, 0.12); }
        .CodeMirror .cm-diff-old {
            background-color: rgba(239, 68, 68, 0.22);
            color: #b91c1c;
            border-radius: 3px;
            box-shadow: inset 0 -1px 0 rgba(239, 68, 68, 0.55);
        }
        .CodeMirror .cm-diff-new {
            background-color: rgba(34, 197, 94, 0.22);
            color: #15803d;
            border-radius: 3px;
            box-shadow: inset 0 -1px 0 rgba(34, 197, 94, 0.55);
        }
        [data-dbx-theme="dark"] .CodeMirror .cm-inserted { background-color: rgba(34, 197, 94, 0.16); }
        [data-dbx-theme="dark"] .CodeMirror .cm-deleted { background-color: rgba(239, 68, 68, 0.18); }
        [data-dbx-theme="dark"] .CodeMirror .cm-value-changed { background-color: rgba(245, 158, 11, 0.14); }
        [data-dbx-theme="dark"] .CodeMirror .cm-diff-old {
            background-color: rgba(239, 68, 68, 0.32);
            color: #fecaca;
        }
        [data-dbx-theme="dark"] .CodeMirror .cm-diff-new {
            background-color: rgba(34, 197, 94, 0.28);
            color: #bbf7d0;
        }
        /* 任意文本：整行标记（左红右绿），不划掉文字，任何内容都保持清晰可读 */
        .CodeMirror .cm-text-del {
            box-shadow: inset 2px 0 0 rgba(239, 68, 68, 0.85);
        }
        .CodeMirror .cm-text-ins {
            box-shadow: inset 2px 0 0 rgba(34, 197, 94, 0.85);
        }
        [data-dbx-theme="dark"] .CodeMirror .cm-text-del {
            box-shadow: inset 2px 0 0 rgba(248, 113, 113, 0.9);
        }
        [data-dbx-theme="dark"] .CodeMirror .cm-text-ins {
            box-shadow: inset 2px 0 0 rgba(74, 222, 128, 0.9);
        }

        /* ================= 结构化差异面板 ================= */
        .diff-report {
            position: absolute;
            right: 0.75rem;
            bottom: 0.75rem;
            width: 340px;
            max-width: calc(100% - 1.5rem);
            max-height: 58%;
            display: none;
            flex-direction: column;
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.28);
            overflow: hidden;
            z-index: 6;
        }
        .diff-report.show { display: flex; }
        .diff-report-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.55rem 0.75rem;
            border-bottom: 1px solid var(--border-light);
            background-color: var(--accent-bg);
            flex-shrink: 0;
        }
        .diff-report-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
        }
        .diff-report-title b { color: var(--primary); font-variant-numeric: tabular-nums; }
        .diff-report-close {
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            padding: 0.1rem 0.25rem;
            border-radius: var(--radius-sm);
        }
        .diff-report-close:hover { background-color: var(--bg-hover, rgba(0,0,0,0.06)); color: var(--text-main); }
        .diff-report-list {
            overflow-y: auto;
            padding: 0.35rem;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .diff-row {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 0.45rem;
            padding: 0.35rem 0.4rem;
            border: none;
            background: transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-align: left;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-main);
        }
        .diff-row:hover { background-color: var(--accent-bg); }
        .diff-row.no-jump { cursor: default; }
        .diff-row.no-jump:hover { background-color: transparent; }
        .diff-tag {
            font-family: var(--font-sans);
            font-size: 0.66rem;
            font-weight: 600;
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            white-space: nowrap;
        }
        .diff-tag.tag-change { background-color: rgba(245, 158, 11, 0.16); color: #b45309; }
        .diff-tag.tag-add { background-color: rgba(34, 197, 94, 0.16); color: #15803d; }
        .diff-tag.tag-remove { background-color: rgba(239, 68, 68, 0.16); color: #b91c1c; }
        [data-dbx-theme="dark"] .diff-tag.tag-change { color: #fbbf24; }
        [data-dbx-theme="dark"] .diff-tag.tag-add { color: #4ade80; }
        [data-dbx-theme="dark"] .diff-tag.tag-remove { color: #fca5a5; }
        .diff-path {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #b45309;
        }
        [data-dbx-theme="dark"] .diff-path { color: #fbbf24; }
        .diff-val {
            color: var(--text-muted);
            max-width: 96px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .diff-report-empty {
            padding: 0.6rem 0.75rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        @media (max-width: 768px) {
            .diff-report { width: auto; left: 0.75rem; max-height: 45%; }
        }

        /* ================= JSON 对比页 ================= */
        .compare-workspace {
            display: none;
            flex: 1 1 0;
            flex-direction: column;
            gap: 0.75rem;
            min-height: 0;
        }
        .compare-workspace.active { display: flex; }
        .toolbar.hidden { display: none; }

        .compare-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            flex-shrink: 0;
            padding: 0.45rem 0.75rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
        }
        .compare-tabs {
            display: flex;
            gap: 2px;
            padding: 3px;
            background-color: var(--accent-bg);
            border-radius: 999px;
            flex-shrink: 0;
        }
        .compare-tab {
            border: none;
            background: transparent;
            padding: 0.28rem 0.7rem;
            border-radius: 999px;
            font-family: var(--font-sans);
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s, color 0.15s;
        }
        .compare-tab:hover { color: var(--text-main); }
        .compare-tab.active {
            background-color: var(--bg-card);
            color: var(--text-main);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }
        .compare-samples {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            flex-wrap: wrap;
        }
        .compare-samples.is-hidden { display: none; }
        .compare-samples-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .sample-chip {
            border: 1px solid var(--border-light);
            background-color: transparent;
            color: var(--text-muted);
            font-size: 0.72rem;
            padding: 0.15rem 0.45rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 0.15s, color 0.15s, background-color 0.15s;
        }
        .sample-chip:hover {
            color: var(--primary);
            border-color: var(--primary);
            background-color: var(--accent-bg);
        }
        .compare-actions {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            margin-left: auto;
            flex-shrink: 0;
        }
        .compare-actions .btn {
            padding: 0.35rem 0.85rem;
            font-size: 0.78rem;
            border-radius: 999px;
        }
        .compare-tip {
            font-size: 0.74rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .compare-tip.diff { color: #b45309; font-weight: 500; }
        .compare-tip.ok { color: #15803d; font-weight: 500; }
        .compare-tip.err { color: #b91c1c; font-weight: 500; }
        [data-dbx-theme="dark"] .compare-tip.diff { color: #fbbf24; }
        [data-dbx-theme="dark"] .compare-tip.ok { color: #4ade80; }
        [data-dbx-theme="dark"] .compare-tip.err { color: #fca5a5; }

        .compare-grid {
            flex: 1 1 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: minmax(0, 1fr);
            gap: 1.25rem;
            min-height: 0;
        }
        .compare-pane {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .compare-pane .editor-container { flex: 1 1 0; min-height: 0; }

        .nav-links a.active {
            color: var(--primary);
            background-color: var(--accent-bg);
        }

        @media (max-width: 900px) {
            .compare-actions { margin-left: 0; }
            .compare-tip { width: 100%; order: 9; }
        }
        @media (max-width: 768px) {
            .compare-grid {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: repeat(2, minmax(0, 1fr));
            }
        }

        /* 差异对比按钮高亮 */
        .btn-diff {            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .btn-diff:hover {
            background-color: #2563eb;
            color: white;
        }

        /* 宽度不足时面板操作按钮只留图标（title 提示仍在），避免挤出面板 */
        @media (max-width: 1100px) {
            .pane-actions .btn span { display: none; }
            .pane-actions .btn { padding: 0.4rem; }
        }

        /* 只有真正窄到放不下两列时才上下堆叠，避免半宽面板里编辑器被压扁 */
        @media (max-width: 768px) {
            .workspace-grid,
            .diff-container.active {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: repeat(2, minmax(0, 1fr));
            }
            .toolbar { flex-direction: row; flex-wrap: wrap; border-radius: var(--radius-lg); padding: 1rem; width: 100%;}
            .main-container { padding: 1rem; gap: 0.75rem; }
            .topbar { gap: 0.25rem; }
            .brand { margin-right: 0.25rem; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span data-i18n="brand">转换工具</span>
    </div>

    <nav class="nav-links" id="navLinks">
        <a data-src="yaml" data-tgt="json" data-i18n="navYamlJson">yaml转json</a>
        <a data-src="yaml" data-tgt="properties" data-i18n="navYamlProps">yaml转properties</a>
        <a data-src="json" data-tgt="properties" data-i18n="navJsonProps">json转properties</a>
        <a data-src="json" data-tgt="xml" data-i18n="navJsonXml">json转xml</a>
        <a data-src="xml" data-tgt="yaml" data-i18n="navXmlYaml">xml转yaml</a>
        <a data-src="json" data-tgt="yaml" data-i18n="navJsonYaml">json转yaml</a>
        <a data-src="yaml" data-tgt="xml" data-i18n="navYamlXml">yaml转xml</a>
        <a id="navCompare" class="nav-compare" data-i18n="navCompare">JSON 对比</a>
    </nav>

    <!-- 导航装不下时，多出来的项收到这里（见 layoutNav） -->
    <div class="nav-more" id="navMore">
        <button type="button" class="nav-more-trigger" id="navMoreTrigger" aria-haspopup="true" aria-expanded="false">
            <span data-i18n="navMore">更多</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="nav-more-menu" id="navMoreMenu"></div>
    </div>

    <div class="lang-switcher" id="langSwitcher">
        <button class="lang-trigger" id="langTrigger">
            <span id="currentLangFlag">🇨🇳</span>
            <span id="currentLangText">简体中文</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lang-menu" id="langMenu"></div>
    </div>
</header>

<main class="main-container">
    <div class="toolbar">
        <div class="select-group">
            <span data-i18n="fromLabel">从</span>
            <div class="custom-select" id="sourceSelect">
                <div class="custom-select-trigger">
                    <span class="label">JSON</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="custom-select-options">
                    <div class="custom-option selected" data-value="json">JSON</div>
                    <div class="custom-option" data-value="yaml">YAML</div>
                    <div class="custom-option" data-value="xml">XML</div>
                    <div class="custom-option" data-value="properties">Properties</div>
                </div>
            </div>
        </div>

        <button class="swap-btn" id="swapBtn" data-i18n-title="swapTitle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
        </button>

        <div class="select-group">
            <span data-i18n="toLabel">转为</span>
            <div class="custom-select" id="targetSelect">
                <div class="custom-select-trigger">
                    <span class="label">YAML</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="custom-select-options">
                    <div class="custom-option" data-value="json">JSON</div>
                    <div class="custom-option selected" data-value="yaml">YAML</div>
                    <div class="custom-option" data-value="xml">XML</div>
                    <div class="custom-option" data-value="properties">Properties</div>
                </div>
            </div>
        </div>

        <!-- 主操作：转换 / 对比 -->
        <button class="btn btn-primary" id="convertBtn" data-i18n-title="convertShortcut">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            <span data-i18n="convertBtn">执行转换</span>
        </button>

        <button class="btn btn-outline" id="toggleDiffBtn" data-i18n="diffBtn" style="border-radius: 9999px;">
            对比差异
        </button>
    </div>

        ];

        const displayLangCodes = ['zh-CN', 'zh-TW', 'en'];

        let currentLang = 'zh-CN';
        let currentDict = languageConfigs.find(c => c.code === 'zh-CN').dict;

        // =========================================
        // 2. DBX 环境与 API 桥接
        // =========================================
        // 主题不能只依赖宿主替我们设置 data-dbx-theme（旧版本宿主 / 独立预览下拿不到），
        // 这里做三级兜底：dbxPlugin.theme -> 宿主注入的 --color-background 亮度 -> 系统偏好。
        function colorLuminance(value) {
            if (!value) return null;
            const probe = document.createElement('span');
            probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none';
            probe.style.color = value;
            if (!probe.style.color) return null;
            document.body.appendChild(probe);
            const resolved = getComputedStyle(probe).color;
            probe.remove();
            const parts = resolved.match(/[\d.]+/g);
            if (!parts || parts.length < 3) return null;
            const [r, g, b] = parts.slice(0, 3).map((n) => {
                const v = parseFloat(n) / 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        }

        function detectAppearance() {
            const root = document.documentElement;
            // 有些宿主用别的方式标记明暗，先认这些线索
            const attrTheme = root.getAttribute('data-theme') || root.getAttribute('data-color-scheme');
            if (attrTheme === 'dark' || attrTheme === 'light') return attrTheme;
            const cs = getComputedStyle(root);
            for (const name of ['--color-background', '--background', '--bg-background']) {
                const lum = colorLuminance(cs.getPropertyValue(name).trim());
                if (lum !== null) return lum < 0.45 ? 'dark' : 'light';
            }
            if (root.classList.contains('dark') || root.classList.contains('theme-dark')) return 'dark';
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
            return 'light';
        }

        // -----------------------------------------
        // 主题切换过渡
        // 只在颜色真的变化时给 <html> 挂 300ms 的 theme-anim，
        // 让导航、工具栏、编辑器底色、边框、文字一起渐变，而不是硬切。
        // -----------------------------------------
        const THEME_ANIM_MS = 300;
        let themeAnimTimer = null;
        let editorThemeTimer = null;    // 延后切 CodeMirror 主题，等底色渐变到一半
        let themeBooted = false;        // 首屏第一次应用完成后才允许做动画
        let themeSource = 'auto';       // host：宿主明确下发；auto：我们自己按环境推断
        let lastAppliedTheme = null;    // 我们写进 data-dbx-theme 的值，用来区分宿主直接写属性

        function prefersReducedMotion() {
            try {
                return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            } catch (e) {
                return false;
            }

        function runThemeTransition(animate) {
            const root = document.documentElement;
            if (!animate || prefersReducedMotion()) {
                clearTimeout(themeAnimTimer);
                root.classList.remove('theme-anim');
                return;

            // 先挂过渡类再改颜色：同一帧里浏览器就会按「新值 + transition」插值

            clearTimeout(themeAnimTimer);
            themeAnimTimer = setTimeout(() => root.classList.remove('theme-anim'), THEME_ANIM_MS + 60);

        // 宿主直接改 data-dbx-theme 时（不经过 dbxPlugin API），也要跟上：
        // 否则样式变了、CodeMirror 还停在旧主题，就成了「一半亮一半暗」。
        if (window.MutationObserver) {

                const next = document.documentElement.getAttribute('data-dbx-theme');
                if (next === lastAppliedTheme) return; // 是我们自己写的
                if (next !== 'dark' && next !== 'light') return;
                const animate = themeBooted && !prefersReducedMotion();
                themeSource = 'host';
                lastAppliedTheme = next;
                runThemeTransition(animate);
                document.documentElement.style.colorScheme = next;
                if (document.querySelector('.CodeMirror')) {
                    syncEditorThemeSoon(animate ? Math.round(THEME_ANIM_MS * 0.34) : 0);
                }
            }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-dbx-theme'] });
        }

        function applyHostTheme(theme) {
            const root = document.documentElement;
            const tokens = (theme && theme.tokens) || {};
            let tokensChanged = false;
            Object.keys(tokens).forEach((name) => {
                // 只接 DBX 约定的根级令牌，避免把无关变量塞进插件
                if (!/^--(color|radius|font)-/.test(name) || typeof tokens[name] !== 'string') return;
                if (root.style.getPropertyValue(name) !== tokens[name]) tokensChanged = true;
                root.style.setProperty(name, tokens[name]);
            });

            let appearance = theme && theme.appearance;
            if (appearance !== 'dark' && appearance !== 'light') {
                // 没有明确 appearance 时：宿主自己写过属性就听它的，否则按令牌亮度/系统偏好推断。
                // 首屏兜底写进去的那个值不算宿主意见，所以只看 themeSource 是否已标记为 host。
                const declared = root.getAttribute('data-dbx-theme');
                appearance = themeSource === 'host' && (declared === 'dark' || declared === 'light')
                    ? declared
                    : detectAppearance();
            } else {
                themeSource = 'host';
            }

            const changed = root.getAttribute('data-dbx-theme') !== appearance;
            // 首屏第一次应用不做动画（否则会看到白底淡入深色），之后换主题/换皮肤都走过渡
            const animate = themeBooted && (changed || tokensChanged) && !prefersReducedMotion();
            if (changed) {
                runThemeTransition(animate);
                root.setAttribute('data-dbx-theme', appearance);
                lastAppliedTheme = appearance;
            } else if (animate) {
                runThemeTransition(true);
            }
            root.style.colorScheme = appearance;
            // 编辑器可能尚未创建，那种情况下由 syncEditorTheme() 在创建后读取属性
            if (document.querySelector('.CodeMirror')) {
                syncEditorThemeSoon(changed && animate ? Math.round(THEME_ANIM_MS * 0.34) : 0);
            }

            if (!themeBooted) {
                // 首屏这一次不做动画，落定后放开，之后任何切换都能平滑
                themeBooted = true;
            }
            return appearance;
        }

        if (window.dbxPlugin) {
            try {
                await window.dbxPlugin.ready;
                if (window.dbxPlugin.locale && languageConfigs.find(c => c.code === window.dbxPlugin.locale)) {
                    currentLang = window.dbxPlugin.locale;
                }
                applyHostTheme(window.dbxPlugin.theme);
                window.addEventListener('dbx-plugin-init', (event) => {
                    applyHostTheme(event.detail && event.detail.theme);
                });
                window.addEventListener('dbx-plugin-env', (event) => {
                    const env = event.detail || {};
                    if (env.locale && languageConfigs.find(c => c.code === env.locale)) {
                        currentLang = env.locale;
                        currentDict = languageConfigs.find(c => c.code === currentLang).dict;
                        renderLangMenu();
                        applyI18n();
                    }
                    if (env.theme) applyHostTheme(env.theme);
                });
            } catch (err) {
                console.warn('DBX init error:', err);
                applyHostTheme(null);
            }
        } else {
            const userLang = navigator.language || 'zh-CN';
            if (languageConfigs.find(c => c.code === userLang)) currentLang = userLang;
            else if (userLang.startsWith('zh')) currentLang = userLang === 'zh-TW' ? 'zh-TW' : 'zh-CN';
            currentDict = languageConfigs.find(c => c.code === currentLang).dict;
            applyHostTheme(null);
            const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
            if (darkQuery && darkQuery.addEventListener) {
                darkQuery.addEventListener('change', () => {
                    if (!window.dbxPlugin) applyHostTheme(null);
                });
            }
        }

        currentDict = languageConfigs.find(c => c.code === currentLang).dict;

        // =========================================
        // 3. 语言菜单渲染与切换
        // =========================================
        const langMenu = document.getElementById('langMenu');
        const langTrigger = document.getElementById('langTrigger');
        const currentLangFlag = document.getElementById('currentLangFlag');
        const currentLangText = document.getElementById('currentLangText');

        function renderLangMenu() {
            langMenu.innerHTML = '';
            languageConfigs.filter(lang => displayLangCodes.includes(lang.code)).forEach(lang => {
                const div = document.createElement('div');
                div.className = `lang-option ${lang.code === currentLang ? 'selected' : ''}`;
                div.innerHTML = `
                    <div class="lang-option-left">
                        <span class="flag">${lang.flag}</span>
                        <span>${lang.name}</span>
                    </div>
                    ${lang.code === currentLang ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
                `;
                div.addEventListener('click', () => {
                    currentLang = lang.code;
                    currentDict = lang.dict;
                    langMenu.classList.remove('open');
                    renderLangMenu();
                    applyI18n();
                });
                langMenu.appendChild(div);
            });

            const currentConfig = languageConfigs.find(c => c.code === currentLang);
            if (currentConfig) {
                currentLangFlag.textContent = currentConfig.flag;
                currentLangText.textContent = currentConfig.name;
            }
        }

        langTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            langMenu.classList.toggle('open');
        });

        document.addEventListener('click', () => {
            langMenu.classList.remove('open');
        });

        // =========================================
        // 3.5 导航溢出 → 收进「更多」
        // =========================================
        const navMoreEl = document.getElementById('navMore');
        const navMoreTrigger = document.getElementById('navMoreTrigger');
        const navMoreMenu = document.getElementById('navMoreMenu');
        const navLinksEl = document.getElementById('navLinks');
        // 「JSON 对比」是主入口，优先留在导航条上，实在放不下才收起来
        const NAV_PIN_SELECTOR = '.nav-compare';

        function navOverflow() {
            return navLinksEl.scrollWidth - navLinksEl.clientWidth > 1;
        }

        function navLinkList() {
            return Array.prototype.slice.call(
                document.querySelectorAll('#navLinks a, #navMoreMenu a')
            );
        }

        // 首次布局时记下原始顺序，之后靠它复原
        function captureNavOrder() {
            navLinkList().forEach((el, i) => {
                if (!el.hasAttribute('data-nav-idx')) el.setAttribute('data-nav-idx', String(i));
            });
        }

        function closeNavMore() {
            navMoreEl.classList.remove('open');
            navMoreTrigger.setAttribute('aria-expanded', 'false');
        }

        // 装得下就全部放回导航条；装不下就把末尾的项依次收进「更多」
        function layoutNav() {
            const links = navLinkList().sort((a, b) => {
                return Number(a.getAttribute('data-nav-idx') || 0) - Number(b.getAttribute('data-nav-idx') || 0);
            });
            navLinksEl.classList.remove('is-empty');
            links.forEach((el) => navLinksEl.appendChild(el));
            navMoreEl.classList.remove('show');
            closeNavMore();

            if (!links.length) return;
            // 放得下就不用「更多」按钮（避免占位把内容挤出去）
            if (!navOverflow()) return;

            navMoreEl.classList.add('show');
            // 从后往前挪；先只挪非固定项
            const movable = links.filter((el) => !el.matches(NAV_PIN_SELECTOR));
            let guard = 0;
            while (navOverflow() && movable.length && guard++ < 64) {
                navMoreMenu.insertBefore(movable.pop(), navMoreMenu.firstChild);
            }
            // 极端窄屏：连固定项也放不下了
            if (navOverflow()) {
                links.filter((el) => el.matches(NAV_PIN_SELECTOR)).forEach((el) => {
                    navMoreMenu.appendChild(el);
                });
            }
            // 一项都没挪出去时不该出现空菜单
            if (!navMoreMenu.children.length) navMoreEl.classList.remove('show');
            // 导航条被搬空时收起这块空白，让「更多」贴着品牌走
            if (!navLinksEl.children.length) navLinksEl.classList.add('is-empty');
        }

        captureNavOrder();

        let navResizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(navResizeTimer);
            navResizeTimer = setTimeout(layoutNav, 80);
        });
        // 字体/样式就绪后宽度会变，再算一次
        window.addEventListener('load', layoutNav);
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => layoutNav()).catch(() => {});
        }

        navMoreTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const open = navMoreEl.classList.toggle('open');
            navMoreTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
        });

        document.addEventListener('click', (e) => {
            if (!navMoreEl.contains(e.target)) closeNavMore();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeNavMore();
        });

        // =========================================
        // 4. 应用国际化
        // =========================================
        function applyI18n() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (currentDict[key]) el.textContent = currentDict[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (currentDict[key]) el.placeholder = currentDict[key];
            });
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (currentDict[key]) el.title = currentDict[key];
            });

            const diffBtn = document.getElementById('toggleDiffBtn');
            if (diffBtn) {
                if (diffBtn.classList.contains('btn-diff')) {

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.custom-select-options').forEach(opt => {
                    if (opt !== options) opt.classList.remove('open');
                });
                document.querySelectorAll('.custom-select-trigger').forEach(tr => {

                options.classList.toggle('open');
                trigger.classList.toggle('active');

            container.querySelectorAll('.custom-option').forEach(opt => {
                opt.addEventListener('click', (e) => {

                    container.querySelectorAll('.custom-option').forEach(o => o.classList.remove('selected'));

                    label.textContent = opt.textContent.trim();
                    options.classList.remove('open');
                    trigger.classList.remove('active');

                    const newVal = opt.dataset.value;
                    if (newVal !== currentValue) {
                        currentValue = newVal;
                        container.dispatchEvent(new CustomEvent('change', {detail: newVal}));
                    }
                });
            });

            return {
                getValue: () => currentValue,
                setValue: (val) => {
                    const targetOpt = container.querySelector(`.custom-option[data-value="${val}"]`);
                    if (targetOpt) {
                        container.querySelectorAll('.custom-option').forEach(o => o.classList.remove('selected'));
                        targetOpt.classList.add('selected');
                        label.textContent = targetOpt.textContent.trim();
                        currentValue = val;

            };

        async function readClipboardText() {
            if (!window.dbxPlugin) {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    return await navigator.clipboard.readText();

                throw new Error('clipboardRead unsupported');
            }
            const caps = window.dbxPlugin.capabilities || {};
            if (!caps.clipboardRead || !window.dbxPlugin.clipboard || typeof window.dbxPlugin.clipboard.readText !== 'function') {
                throw new Error('clipboardRead unsupported');
            }
            return await window.dbxPlugin.clipboard.readText();

        async function writeClipboardText(text) {
            if (window.dbxPlugin && (typeof window.dbxPlugin.copy === 'function' || (window.dbxPlugin.clipboard && window.dbxPlugin.clipboard.writeText))) {
                const caps = window.dbxPlugin.capabilities || {};
                if (caps.clipboardWrite === false) {
                    throw new Error('clipboardWrite unsupported');
                }
                if (typeof window.dbxPlugin.copy === 'function') {
                    await window.dbxPlugin.copy(text);
                } else {
                    await window.dbxPlugin.clipboard.writeText(text);
                }
                return;
            }
            if (!navigator.clipboard || !navigator.clipboard.writeText) {
                throw new Error('clipboardWrite unsupported');

            await navigator.clipboard.writeText(text);

        /* 差异算法分两层：
           - ui/js/diff.js    行级对比（解析不了对象时的兜底）
           - ui/js/objdiff.js 结构化对比（按 JSON Pointer 逐节点比较）
           用例：node tests/diff.test.js / node tests/objdiff.test.js */
        if (!window.DBXDiff || !window.DBXObjDiff) throw new Error('ui/js/diff.js 或 ui/js/objdiff.js 未加载');
        const { diffLines, sides } = window.DBXDiff;

        let diffMarks = [];

        // JSON 先规范化再比较，否则压缩过的单行 JSON 会和格式化文本错位
        function textForDiff(text, format) {
            if (!text) return text;
            if (format !== 'json') return text;
            try {
                return JSON.stringify(JSON.parse(text), null, 2);
            } catch (e) {
                return text;
            }
        }

        function parseSide(text, format) {
            if (!text || !text.trim()) return { ok: false, value: null };
            try {
                return { ok: true, value: parseData(text, format) };
            } catch (e) {
                return { ok: false, value: null };
            }
        }

        function clearDiffDecorations() {
            diffMarks.forEach((mark) => {
                try { mark.clear(); } catch (e) { /* 编辑器重建过 */ }
            });
            diffMarks = [];
            [diffLeftEditor, diffRightEditor].forEach((cm) => {
                if (!cm) return;
                const doc = cm.getDoc();
                for (let i = 0; i < doc.lineCount(); i++) {
                    doc.removeLineClass(i, 'background', 'cm-deleted');
                    doc.removeLineClass(i, 'background', 'cm-inserted');
                    doc.removeLineClass(i, 'background', 'cm-value-changed');
                }
            });
        }

        function markSpan(cm, span, className) {
            if (!cm || !span) return;
            diffMarks.push(cm.getDoc().markText(
                { line: span.line, ch: span.col },
                { line: span.line, ch: span.endCol },
                { className: className }
            ));
        }

        // 没有对象树时的兜底：整行标红/标绿
        function applyLineDiff(leftView, rightView, leftDoc, rightDoc) {
            const diff = diffLines(leftView, rightView);
            const parts = sides(diff.ops);
            parts.left.forEach((p) => {
                if (p.type === 'delete') leftDoc.addLineClass(p.line, 'background', 'cm-deleted');
            });
            parts.right.forEach((p) => {
                if (p.type === 'insert') rightDoc.addLineClass(p.line, 'background', 'cm-inserted');
            });
            if (diffLeftStat) diffLeftStat.textContent = '−' + diff.stats.removed;
            if (diffRightStat) diffRightStat.textContent = '+' + diff.stats.added;
            return diff;
        }

        function renderReport(changes, leftMap, rightMap) {
            diffReportList.textContent = '';
            diffRows = [];

            if (!changes.length) {
                diffReportTitle.textContent = currentDict.diffSame || 'No differences';
                const empty = document.createElement('div');
                empty.className = 'diff-report-empty';
                empty.textContent = currentDict.diffSameHint || '';
                diffReportList.appendChild(empty);
                diffReport.classList.add('show');
                return;
            }

            diffReportTitle.textContent = (currentDict.diffReportTitle || 'Structured changes: {n}')
                .replace('{n}', changes.length);

            changes.forEach((change, index) => {
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'diff-row';

                const tag = document.createElement('span');
                tag.className = 'diff-tag ' + (change.type === 'add' ? 'tag-add' : change.type === 'remove' ? 'tag-remove' : 'tag-change');
                tag.textContent = change.type === 'add'
                    ? (currentDict.diffAdd || 'Added')
                    : change.type === 'remove'
                        ? (currentDict.diffRemove || 'Deleted')
                        : (currentDict.diffChange || 'Modified');

                const pathEl = document.createElement('code');
                pathEl.className = 'diff-path';
                pathEl.textContent = change.pointer;
                pathEl.title = change.pointer;

                const valueEl = document.createElement('span');
                valueEl.className = 'diff-val';
                valueEl.textContent = displayValue(change.type === 'remove' ? change.from : change.to);
                valueEl.title = valueEl.textContent;

                row.appendChild(tag);
                row.appendChild(pathEl);
                row.appendChild(valueEl);

                const leftLine = leftMap && leftMap[change.pointer] ? leftMap[change.pointer].line : null;
                const rightLine = rightMap && rightMap[change.pointer] ? rightMap[change.pointer].line : null;
                diffRows.push({ leftLine: leftLine, rightLine: rightLine });

                if (leftLine == null && rightLine == null) row.classList.add('no-jump');

                row.addEventListener('click', () => {
                    const target = diffRows[index];
                    if (!target || (target.leftLine == null && target.rightLine == null)) return;
                    if (target.leftLine != null && diffLeftEditor) {
                        diffLeftEditor.scrollIntoView({ line: target.leftLine, ch: 0 }, 160);
                    }
                    if (target.rightLine != null && diffRightEditor) {
                        diffRightEditor.scrollIntoView({ line: target.rightLine, ch: 0 }, 160);
                    }
                });

                diffReportList.appendChild(row);
            });

            diffReport.classList.add('show');
        }

        function openDiff() {
            mainWorkspace.classList.add('hidden');
            diffWorkspace.classList.add('active');
            toggleDiffBtn.textContent = currentDict.diffExitBtn || '退出对比';
            toggleDiffBtn.classList.add('btn-diff');

            if (!diffLeftEditor) {
                diffLeftEditor = CodeMirror.fromTextArea(diffLeftText, Object.assign({}, commonConfig, {
                    readOnly: 'nocursor',
                    mode: MODE_MAP.json
                }));
                diffRightEditor = CodeMirror.fromTextArea(diffRightText, Object.assign({}, commonConfig, {
                    readOnly: 'nocursor',
                    mode: MODE_MAP.json
                }));
            }

            clearDiffDecorations();
            diffReport.classList.remove('show');

            const srcFmt = sourceFormat.value;
            const tgtFmt = targetFormat.value;
            const left = parseSide(inputText.value, srcFmt);
            const right = parseSide(outputText.value, tgtFmt);
            const bothJson = srcFmt === 'json' && tgtFmt === 'json' && left.ok && right.ok;

            let leftView = textForDiff(inputText.value, srcFmt);
            let rightView = textForDiff(outputText.value, tgtFmt);
            let leftMap = null;
            let rightMap = null;

            // 两侧都是 JSON 时用带位置映射的打印结果，页面才能只标「变了的那个值」
            if (bothJson) {
                const trackedLeft = serializeTracked(left.value);
                const trackedRight = serializeTracked(right.value);
                leftView = trackedLeft.text;
                rightView = trackedRight.text;
                leftMap = trackedLeft.map;
                rightMap = trackedRight.map;
            }

            const leftDoc = diffLeftEditor.getDoc();
            const rightDoc = diffRightEditor.getDoc();
            leftDoc.setValue(leftView);
            leftDoc.clearHistory();
            rightDoc.setValue(rightView);
            rightDoc.clearHistory();

            if (left.ok && right.ok) {
                const result = diffObjects(left.value, right.value);
                const changes = result.changes;
                const stats = result.stats;

                if (bothJson) {
                    changes.forEach((change) => {
                        const ls = leftMap[change.pointer];
                        const rs = rightMap[change.pointer];
                        if (change.type === 'change') {
                            if (ls) {
                                leftDoc.addLineClass(ls.line, 'background', 'cm-value-changed');
                                markSpan(diffLeftEditor, ls, 'cm-diff-old');
                            }
                            if (rs) {
                                rightDoc.addLineClass(rs.line, 'background', 'cm-value-changed');
                                markSpan(diffRightEditor, rs, 'cm-diff-new');
                            }
                        } else if (change.type === 'remove') {
                            if (ls) {
                                leftDoc.addLineClass(ls.line, 'background', 'cm-deleted');
                                markSpan(diffLeftEditor, ls, 'cm-diff-old');
                            }
                        } else if (rs) {
                            rightDoc.addLineClass(rs.line, 'background', 'cm-inserted');
                            markSpan(diffRightEditor, rs, 'cm-diff-new');
                        }
                    });
                    if (diffLeftStat) diffLeftStat.textContent = '−' + (stats.changed + stats.removed);
                    if (diffRightStat) diffRightStat.textContent = '+' + (stats.changed + stats.added);
                    renderReport(changes, leftMap, rightMap);
                } else if (srcFmt === tgtFmt) {
                    // 同格式但不是 JSON（yaml→yaml 等）：逐行标记仍然有意义
                    applyLineDiff(leftView, rightView, leftDoc, rightDoc);
                    renderReport(changes, null, null);
                } else {
                    // 跨格式（json ↔ yaml）：两份文本本来就没有行对应关系，
                    // 整块涂红只会误导，这里只给结构化清单
                    if (diffLeftStat) diffLeftStat.textContent = '−' + (stats.changed + stats.removed);
                    if (diffRightStat) diffRightStat.textContent = '+' + (stats.changed + stats.added);
                    renderReport(changes, null, null);
                }
            } else {
                applyLineDiff(leftView, rightView, leftDoc, rightDoc);
            }

            diffLeftEditor.setOption('mode', MODE_MAP[srcFmt] || 'text/plain');
            diffRightEditor.setOption('mode', MODE_MAP[tgtFmt] || 'text/plain');
            syncEditorTheme();

            requestAnimationFrame(() => {
                diffLeftEditor.refresh();
                diffRightEditor.refresh();
            });
        }

        function t(key, fallback) {
            return currentDict[key] || fallback;
