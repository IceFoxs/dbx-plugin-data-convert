<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Format Converter</title>

    <!-- 引入核心依赖 -->
    <script src="js-yaml.min.js"></script>
    <script src="json/index.js"></script>
    <script src="xml-js.min.js"></script>
    <script>
        // 保底逻辑：如果网络加载失败，使用简单的 fallback
        if (typeof stringify !== 'function') {
            window.stringify = function (obj, options) {
                return JSON.stringify(obj, null, options && options.indent ? options.indent : 2);
            };
        }
        if (typeof xml2js === 'undefined' || typeof js2xml === 'undefined') {
            console.warn('xml-js CDN 加载失败，将退回基础解析逻辑');
        }
    </script>

    <style>
        /* =========================================
           基于 DBX 设计令牌的主题样式
           ========================================= */
        :root {
            --bg-base: var(--color-background, #ffffff);
            --bg-card: var(--color-card, #ffffff);
            --text-main: var(--color-foreground, #09090b);
            --text-muted: var(--color-muted-foreground, #71717a);
            --border-light: var(--color-border, #e4e4e7);
            --primary: var(--color-primary, #18181b);
            --primary-text: var(--color-primary-foreground, #fafafa);
            --accent-bg: var(--color-muted, #f4f4f5);
            --accent-hover: var(--color-border, #e4e4e7);

            --radius-md: var(--radius-md, 0.5rem);
            --radius-lg: var(--radius-lg, 0.75rem);
            --font-sans: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif);
            --font-mono: var(--font-mono, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace);
        }

        [data-dbx-theme="dark"] {
            --bg-base: #09090b;
            --bg-card: #121214;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-light: #27272a;
            --accent-bg: #18181b;
            --accent-hover: #27272a;
            --primary: #3b82f6;
            --primary-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 顶部导航栏 */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            height: 3.5rem;
            border-bottom: 1px solid var(--border-light);
            background-color: var(--bg-base);
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .brand svg {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 0.25rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            white-space: nowrap;
            flex: 1;
            justify-content: center;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-links::-webkit-scrollbar {
            display: none;
        }

        .nav-links a {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-md);
            transition: all 0.15s ease;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: var(--text-main);
            background-color: var(--accent-bg);
        }

        /* 语言切换器 */
        .lang-switcher {
            position: relative;
            flex-shrink: 0;
            margin-left: 1rem;
        }

        .lang-trigger {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            background-color: transparent;
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.15s;
        }

        .lang-trigger:hover {
            background-color: var(--accent-bg);
        }

        .lang-trigger svg {
            width: 1rem;
            height: 1rem;
            color: var(--text-muted);
        }

        .lang-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 200px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            padding: 0.35rem;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 400px;
            overflow-y: auto;
        }

        .lang-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .lang-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background-color 0.1s;
            color: var(--text-main);
        }

        .lang-option:hover {
            background-color: var(--accent-bg);
        }

        .lang-option.selected {
            color: var(--primary);
            font-weight: 600;
            background-color: var(--accent-bg);
        }

        .lang-option-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lang-option-left span.flag {
            font-size: 1.1rem;
        }

        /* 主工作区 */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            overflow: hidden;
            gap: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            background-color: var(--bg-card);
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            border: 1px solid var(--border-light);
            align-self: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .select-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
            position: relative;
        }

        .custom-select-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 100px;
            background-color: var(--accent-bg);
            border: 1px solid transparent;
            padding: 0.4rem 0.75rem;
            font-size: 0.85rem;
            border-radius: var(--radius-md);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s ease;
            user-select: none;
        }

        .custom-select-trigger:hover {
            background-color: var(--accent-hover);
        }

        .custom-select-trigger.active {
            border-color: var(--primary);
            outline: none;
        }

        .custom-select-trigger svg {
            width: 0.9rem;
            height: 0.9rem;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .custom-select-trigger.active svg {
            transform: rotate(180deg);
        }

        .custom-select-options {
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) scaleY(0.95);
            min-width: 130px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            padding: 0.35rem;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transform-origin: top center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .custom-select-options.open {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scaleY(1);
        }

        .custom-option {
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--text-main);
            transition: background-color 0.1s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .custom-option:hover {
            background-color: var(--accent-hover);
        }

        .custom-option.selected {
            background-color: var(--accent-bg);
            color: var(--primary);
            font-weight: 600;
        }

        .custom-option.selected::after {
            content: '✓';
            font-size: 0.9rem;
        }

        .swap-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            background-color: var(--primary);
            border: none;
            color: var(--primary-text);
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.4);
        }

        .swap-btn:hover {
            opacity: 0.9;
            transform: rotate(180deg) scale(1.05);
        }

        .swap-btn svg {
            width: 1.1rem;
            height: 1.1rem;
        }

        .workspace-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            min-height: 0;
        }

        .pane {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-height: 0;
        }

        .pane-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            padding: 0 0.25rem;
        }

        .pane-title {
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-main);
        }

        .pane-title svg {
            color: var(--text-muted);
        }

        .pane-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .editor-container {
            flex: 1;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-card);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .editor-container:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }

        .textarea {
            width: 100%;
            height: 100%;
            padding: 1.25rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text-main);
            background-color: var(--bg-card);
            border: none;
            outline: none;
            resize: none;
            tab-size: 2;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn svg {
            width: 0.9rem;
            height: 0.9rem;
            flex-shrink: 0;
        }

        .btn-primary {
            background-color: var(--text-main);
            color: var(--bg-card);
            flex: 1;
            padding: 0.6rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .btn-primary:hover {
            opacity: 0.85;
        }

        .btn-outline {
            background-color: transparent;
            border-color: var(--border-light);
            color: var(--text-muted);
        }

        .btn-outline:hover {
            background-color: var(--accent-bg);
            color: var(--text-main);
            border-color: var(--accent-hover);
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border-light);
            background-color: var(--accent-bg);
            flex-shrink: 0;
        }

        .result-header-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: none;
        }

        .toast {
            background-color: var(--text-main);
            color: var(--bg-card);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            transition: opacity 0.3s, transform 0.3s;
        }

        .toast.error {
            background-color: #ef4444;
            color: #fff;
        }

        .toast.hide {
            opacity: 0;
            transform: translateX(100%);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 900px) {
            .workspace-grid {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-wrap: wrap;
                height: auto;
                padding: 1rem;
                gap: 1rem;
            }

            .nav-links {
                justify-content: flex-start;
                width: 100%;
                order: 3;
            }

            .lang-switcher {
                margin-left: auto;
            }

            .toolbar {
                flex-direction: row;
                flex-wrap: wrap;
                border-radius: var(--radius-lg);
                padding: 1rem;
                width: 100%;
            }

            .main-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span data-i18n="brand">转换工具</span>
    </div>

    <nav class="nav-links" id="navLinks">
        <a data-src="yaml" data-tgt="json" data-i18n="navYamlJson">yaml转json</a>
        <a data-src="yaml" data-tgt="properties" data-i18n="navYamlProps">yaml转properties</a>
        <a data-src="json" data-tgt="properties" data-i18n="navJsonProps">json转properties</a>
        <a data-src="json" data-tgt="xml" data-i18n="navJsonXml">json转xml</a>
        <a data-src="xml" data-tgt="yaml" data-i18n="navXmlYaml">xml转yaml</a>
        <a data-src="json" data-tgt="yaml" data-i18n="navJsonYaml">json转yaml</a>
        <a data-src="yaml" data-tgt="xml" data-i18n="navYamlXml">yaml转xml</a>
    </nav>

    <div class="lang-switcher" id="langSwitcher">
        <button class="lang-trigger" id="langTrigger">
            <span id="currentLangFlag">🇨🇳</span>
            <span id="currentLangText">简体中文</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </button>
        <div class="lang-menu" id="langMenu"></div>
    </div>
</header>

<main class="main-container">
    <div class="toolbar">
        <div class="select-group">
            <span data-i18n="fromLabel">从</span>
            <div class="custom-select" id="sourceSelect">
                <div class="custom-select-trigger">
                    <span class="label">JSON</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
                <div class="custom-select-options">
                    <div class="custom-option selected" data-value="json">JSON</div>
                    <div class="custom-option" data-value="yaml">YAML</div>
                    <div class="custom-option" data-value="xml">XML</div>
                    <div class="custom-option" data-value="properties">Properties</div>
                </div>
            </div>
        </div>

        <button class="swap-btn" id="swapBtn" data-i18n-title="swapTitle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
            </svg>
        </button>

        <div class="select-group">
            <span data-i18n="toLabel">转为</span>
            <div class="custom-select" id="targetSelect">
                <div class="custom-select-trigger">
                    <span class="label">YAML</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
                <div class="custom-select-options">
                    <div class="custom-option" data-value="json">JSON</div>
                    <div class="custom-option selected" data-value="yaml">YAML</div>
                    <div class="custom-option" data-value="xml">XML</div>
                    <div class="custom-option" data-value="properties">Properties</div>
                </div>
            </div>
        </div>
    </div>

    <div class="workspace-grid">
        <div class="pane">
            <div class="pane-header">
                <div class="pane-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <span data-i18n="inputLabel">输入内容</span>
                </div>
                <div class="pane-actions">
                    <button class="btn btn-outline" id="formatInputBtn" data-i18n-title="formatBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="21" y1="10" x2="3" y2="10"/>
                            <line x1="21" y1="6" x2="3" y2="6"/>
                            <line x1="21" y1="14" x2="3" y2="14"/>
                            <line x1="21" y1="18" x2="3" y2="18"/>
                        </svg>
                        <span data-i18n="formatBtn">格式化</span>
                    </button>
                    <button class="btn btn-outline" id="genMockBtn" data-i18n-title="mockBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v20"/>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                        </svg>
                        <span data-i18n="mockBtn">模拟数据</span>
                    </button>
                    <button class="btn btn-outline" id="clearInputBtn" data-i18n-title="clearBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="editor-container">
                <textarea id="inputText" class="textarea" data-i18n-placeholder="inputPlaceholder"></textarea>
            </div>
            <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                <button class="btn btn-primary" id="convertBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9"/>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                        <polyline points="7 23 3 19 7 15"/>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                    </svg>
                    <span data-i18n="convertBtn">执行转换</span>
                </button>
            </div>
        </div>

        <div class="pane">
            <div class="pane-header">
                <div class="pane-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    <span data-i18n="outputLabel">输出结果</span>
                </div>
                <div class="pane-actions">
                    <button class="btn btn-outline" id="formatOutputBtn" data-i18n-title="formatBtn">

        // 仅在菜单中展示的语言代码
        const displayLangCodes = ['zh-CN', 'zh-TW', 'en'];

        let currentLang = 'zh-CN';
        let currentDict = languageConfigs.find(c => c.code === 'zh-CN').dict;

        // =========================================
        // 2. DBX 环境与 API 桥接
        // =========================================
        if (window.dbxPlugin) {
            try {
                await window.dbxPlugin.ready;
                if (window.dbxPlugin.locale && languageConfigs.find(c => c.code === window.dbxPlugin.locale)) {
                    currentLang = window.dbxPlugin.locale;
                }
                window.addEventListener('dbx-plugin-env', (event) => {
                    const env = event.detail;
                    if (env.locale && languageConfigs.find(c => c.code === env.locale)) {
                        currentLang = env.locale;
                        currentDict = languageConfigs.find(c => c.code === currentLang).dict;
                        renderLangMenu();
                        applyI18n();
                    }
                    if (env.theme && env.theme.appearance) {
                        document.documentElement.setAttribute('data-dbx-theme', env.theme.appearance);
                    }
                });
            } catch (err) {
                console.warn('DBX init error:', err);
            }
        } else {
            // 浏览器兜底
            const userLang = navigator.language || 'zh-CN';
            if (languageConfigs.find(c => c.code === userLang)) currentLang = userLang;
            else if (userLang.startsWith('zh')) currentLang = userLang === 'zh-TW' ? 'zh-TW' : 'zh-CN';
            currentDict = languageConfigs.find(c => c.code === currentLang).dict;
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-dbx-theme', 'dark');
            }
        }

        // 强制同步当前语言字典
        currentDict = languageConfigs.find(c => c.code === currentLang).dict;

        // =========================================
        // 3. 语言菜单渲染与切换
        // =========================================
        const langMenu = document.getElementById('langMenu');
        const langTrigger = document.getElementById('langTrigger');
        const currentLangFlag = document.getElementById('currentLangFlag');
        const currentLangText = document.getElementById('currentLangText');

        function renderLangMenu() {
            langMenu.innerHTML = '';
            languageConfigs.filter(lang => displayLangCodes.includes(lang.code)).forEach(lang => {
                const div = document.createElement('div');
                div.className = `lang-option ${lang.code === currentLang ? 'selected' : ''}`;
                div.innerHTML = `
                    <div class="lang-option-left">
                        <span class="flag">${lang.flag}</span>
                        <span>${lang.name}</span>
                    </div>
                    ${lang.code === currentLang ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
                `;
                div.addEventListener('click', () => {
                    currentLang = lang.code;
                    currentDict = lang.dict;
                    langMenu.classList.remove('open');
                    renderLangMenu();
                    applyI18n();
                });
                langMenu.appendChild(div);
            });

            const currentConfig = languageConfigs.find(c => c.code === currentLang);
            if (currentConfig) {
                currentLangFlag.textContent = currentConfig.flag;
                currentLangText.textContent = currentConfig.name;
            }
        }

        langTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            langMenu.classList.toggle('open');
        });

        document.addEventListener('click', () => {
            langMenu.classList.remove('open');
        });

        // =========================================
        // 4. 应用国际化
        // =========================================
        function applyI18n() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (currentDict[key]) el.textContent = currentDict[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (currentDict[key]) el.placeholder = currentDict[key];
            });
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (currentDict[key]) el.title = currentDict[key];
            });
            updateOutputLabel();
        }

        // =========================================
        // 5. 业务逻辑
        // =========================================
        function initCustomSelect(containerId) {
            const container = document.getElementById(containerId);
            const trigger = container.querySelector('.custom-select-trigger');
            const options = container.querySelector('.custom-select-options');
            const label = trigger.querySelector('.label');
            let currentValue = container.querySelector('.custom-option.selected').dataset.value;

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.custom-select-options').forEach(opt => {
                    if (opt !== options) opt.classList.remove('open');
                });
                document.querySelectorAll('.custom-select-trigger').forEach(tr => {
                    if (tr !== trigger) tr.classList.remove('active');
                });
                options.classList.toggle('open');
                trigger.classList.toggle('active');
            });

            container.querySelectorAll('.custom-option').forEach(opt => {
                opt.addEventListener('click', (e) => {
                    e.stopPropagation();
                    container.querySelectorAll('.custom-option').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    label.textContent = opt.textContent.trim();
                    options.classList.remove('open');
                    trigger.classList.remove('active');

                    const newVal = opt.dataset.value;
                    if (newVal !== currentValue) {
                        currentValue = newVal;
                        container.dispatchEvent(new CustomEvent('change', {detail: newVal}));
                    }
                });
            });

            return {
                getValue: () => currentValue,
                setValue: (val) => {
                    const targetOpt = container.querySelector(`.custom-option[data-value="${val}"]`);
                    if (targetOpt) {
                        container.querySelectorAll('.custom-option').forEach(o => o.classList.remove('selected'));
                        targetOpt.classList.add('selected');
                        label.textContent = targetOpt.textContent.trim();
                        currentValue = val;
                    }
                }
            };
        }

        const sourceSelect = initCustomSelect('sourceSelect');
        const targetSelect = initCustomSelect('targetSelect');

        document.addEventListener('click', () => {
            document.querySelectorAll('.custom-select-options').forEach(opt => opt.classList.remove('open'));
            document.querySelectorAll('.custom-select-trigger').forEach(tr => tr.classList.remove('active'));
        });

        const navLinks = document.querySelectorAll('#navLinks a');
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const swapBtn = document.getElementById('swapBtn');
        const convertBtn = document.getElementById('convertBtn');
        const clearInputBtn = document.getElementById('clearInputBtn');
        const genMockBtn = document.getElementById('genMockBtn');
        const copyBtn = document.getElementById('copyBtn');
        const outputLabel = document.getElementById('outputLabel');
        const formatInputBtn = document.getElementById('formatInputBtn');
        const formatOutputBtn = document.getElementById('formatOutputBtn');
        const toastContainer = document.getElementById('toastContainer');

        let sourceFormat = {value: sourceSelect.getValue()};
        let targetFormat = {value: targetSelect.getValue()};

        let currentDataObj = null;

        inputText.addEventListener('input', () => {
            currentDataObj = null;
        });
        outputText.addEventListener('input', () => {
            if (outputText.value.trim() === '' || outputText.value === currentDict.outputPlaceholder) {
                currentDataObj = null;
            }
        });

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            toast.innerHTML = `<span>${message}</span>`;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                handleFormatChange(link.dataset.src, link.dataset.tgt);
            });
        });

        document.getElementById('sourceSelect').addEventListener('change', (e) => {
            sourceFormat.value = e.detail;
            updateOutputLabel();
            if (currentDataObj) {
                try {
                    inputText.value = serializeData(currentDataObj, sourceFormat.value);
                } catch (err) {
                    outputText.value = currentDict.outputPlaceholder;
                }
            }
            doConvertSilent();
        });

        document.getElementById('targetSelect').addEventListener('change', (e) => {
            targetFormat.value = e.detail;
            updateOutputLabel();
            doConvertSilent();
        });

        swapBtn.addEventListener('click', () => {
            const temp = sourceFormat.value;
            sourceFormat.value = targetFormat.value;
            targetFormat.value = temp;

            sourceSelect.setValue(sourceFormat.value);
            targetSelect.setValue(targetFormat.value);

            const currentOutput = outputText.value;
            if (currentOutput && currentOutput !== currentDict.outputPlaceholder && currentOutput !== currentDict.toastSameFormat) {
                inputText.value = currentOutput;
                currentDataObj = null;
            }
            updateOutputLabel();
            doConvertSilent();
        });

        function updateOutputLabel() {
            outputLabel.textContent = `Result Output (${targetFormat.value.toUpperCase()})`;
        }

        function handleFormatChange(newSrc, newTgt) {
            sourceFormat.value = newSrc;
            targetFormat.value = newTgt;
            sourceSelect.setValue(newSrc);
            targetSelect.setValue(newTgt);
            updateOutputLabel();

            const raw = inputText.value.trim();
            if (raw && raw !== currentDict.outputPlaceholder) {
                try {
                    try {
                        currentDataObj = parseData(raw, newSrc);
                        inputText.value = serializeData(currentDataObj, newSrc);
                    } catch (e) {
                        currentDataObj = null;
                    }
                } catch (err) {
                }
            }
            doConvertSilent();
        }

        function doConvertSilent() {
            const raw = inputText.value.trim();
            if (!raw || raw === currentDict.outputPlaceholder) {
                outputText.value = currentDict.outputPlaceholder;
                return;
            }

            const src = sourceFormat.value;
            const tgt = targetFormat.value;

            try {
                if (!currentDataObj) {
                    currentDataObj = parseData(raw, src);
                }
                outputText.value = serializeData(currentDataObj, tgt);
            } catch (err) {
                if (src === tgt) {
                    outputText.value = raw;
                } else {
                    outputText.value = currentDict.toastConvertError;
                    currentDataObj = null;
                }
            }
        }

        genMockBtn.addEventListener('click', () => {
            const src = sourceFormat.value;
            const tgt = targetFormat.value;

            currentDataObj = {
                id: 1001,
                title: "测试数据",
                author: {
                    name: "张三",
                    email: "zhangsan@example.com"
                },
                tags: ["admin", "editor", "viewer"],
                metadata: {
                    createdAt: "2023-10-27T10:00:00Z",
                    version: 1.2,
                    isActive: true
                }
            };

            try {
                inputText.value = serializeData(currentDataObj, src);
                outputText.value = serializeData(currentDataObj, tgt);
                showToast(currentDict.toastMockSuccess);
            } catch (err) {
                showToast(currentDict.toastFormatError, 'error');
            }
        });

        formatInputBtn.addEventListener('click', () => {
            const raw = inputText.value.trim();
            if (!raw) return;
            try {
                if (sourceFormat.value === 'xml') {
                    inputText.value = formatXmlString(raw);
                } else {
                    const obj = parseData(raw, sourceFormat.value);
                    inputText.value = serializeData(obj, sourceFormat.value);
                    currentDataObj = obj;
                }
                showToast(currentDict.toastFormatInput);
            } catch (err) {
                showToast(currentDict.toastFormatError, 'error');
            }
        });

        formatOutputBtn.addEventListener('click', () => {
            const raw = outputText.value.trim();
            if (raw === currentDict.outputPlaceholder || !raw) return;
            try {
                if (targetFormat.value === 'xml') {
                    outputText.value = formatXmlString(raw);
                } else {
                    const obj = parseData(raw, targetFormat.value);
                    outputText.value = serializeData(obj, targetFormat.value);
                }
                showToast(currentDict.toastFormatOutput);
            } catch (err) {
                showToast(currentDict.toastFormatError, 'error');
            }
        });

        function doConvert() {
            const raw = inputText.value.trim();
            if (!raw) {
                showToast(currentDict.toastEmptyInput, 'error');
                return;
            }
            const src = sourceFormat.value, tgt = targetFormat.value;
            try {
                currentDataObj = parseData(raw, src);
                outputText.value = serializeData(currentDataObj, tgt);
                showToast(currentDict.toastConvertSuccess);
            } catch (err) {
                outputText.value = `Error: ${err.message}`;
                currentDataObj = null;
                showToast(currentDict.toastConvertError, 'error');
            }
        }

        convertBtn.addEventListener('click', doConvert);

        function parseData(text, format) {
            if (format === 'json') {
                try {
                    return JSON.parse(text);
                } catch (e) {
                    try {
                        return jsyaml.load(text);
                    } catch (yamlErr) {
                        throw new Error("Invalid JSON or YAML format");
                    }
                }
            }
            if (format === 'yaml') {
                try {
                    return jsyaml.load(text);
                } catch (e) {
                    try {
                        return JSON.parse(text);
                    } catch (jsonErr) {
                        throw new Error("Invalid YAML or JSON format");
                    }
                }
            }
            if (format === 'xml') return xmlToObj(text);
            if (format === 'properties') return propertiesToObj(text);
            throw new Error("Unknown format");
        }

        function serializeData(obj, format) {
            if (format === 'json') {
                try {
                    return window.stringify(obj, {indent: 2, maxLength: 80});
                } catch (e) {
                    return JSON.stringify(obj, null, 2);
                }
            }
            if (format === 'yaml') return jsyaml.dump(obj);
            if (format === 'xml') return objToXml(obj);
            if (format === 'properties') return objToProperties(obj);
            throw new Error("Unknown format");
        }

        function formatXmlString(xml) {
            try {
                if (typeof xml2js !== 'undefined') {
                    const result = xml2js(xml, {compact: false, spaces: 2});
                    const opts = {compact: false, spaces: 2};
                    return js2xml(result, opts);
                }
            } catch (e) {
            }

            // 保底美化
            let formatted = '';
            xml = xml.replace(/>\s*</g, '><').trim();
            let xmlDecl = '';
            const declMatch = xml.match(/^<\?xml.*?\?>/);
            if (declMatch) {
                xmlDecl = declMatch[0];
                xml = xml.replace(declMatch[0], '').trim();
            }
            const reg = /(>)(<)(\/*)/g;
            xml = xml.replace(reg, '$1\n$2$3');
            let pad = 0;
            xml.split('\n').forEach(node => {
                let indent = 0;
                if (node.match(/.+<\/\w[^>]*>$/)) indent = 0;
                else if (node.match(/^<\/\w/)) {
                    if (pad != 0) pad -= 1;
                } else if (node.match(/^<\w[^>]*[^\/]>.*$/)) indent = 1;
                let padding = '';
                for (let i = 0; i < pad; i++) padding += '  ';
                formatted += padding + node + '\n';
                pad += indent;
            });
            formatted = formatted.replace(/<\s+(\/?[^>]+)>/g, '<$1>');
            return (xmlDecl ? xmlDecl + '\n' : '') + formatted.trim();
        }

        function xmlToObj(xmlStr) {
            try {
                if (typeof xml2js === 'undefined') throw new Error("xml-js library not loaded");

                let cleanXml = xmlStr.trim();
                if (cleanXml.startsWith('<?xml')) cleanXml = cleanXml.replace(/<\?xml.*?\?>/, '').trim();

                // 如果没有根节点包裹，XML 解析器会报错，我们手动包装一下
                if (!cleanXml.startsWith('<root>')) {
                    cleanXml = `<root>${cleanXml}</root>`;
                }

                // 使用专业库解析，保留重复标签为数组
                const result = xml2js(cleanXml, {compact: true, trim: true});

                // 如果是包装过的，需要把外面的一层 root 去掉
                if (result.root) {
                    return result.root;
                }
                return result;
            } catch (e) {
                console.warn('xml-js 解析失败，使用基础兜底逻辑:', e);
                // 基础兜底逻辑
                let cleanXml = xmlStr.trim();
                if (cleanXml.startsWith('<?xml')) cleanXml = cleanXml.replace(/<\?xml.*?\?>/, '').trim();
                if (!cleanXml.startsWith('<root>')) cleanXml = `<root>${cleanXml}</root>`;
                const parser = new DOMParser();
                const doc = parser.parseFromString(cleanXml, "text/xml");
                if (doc.querySelector('parsererror')) throw new Error("XML 格式错误");
                const root = doc.documentElement;

                function nodeToObjInner(node) {
                    const obj = {};
                    if (node.children.length === 0) return node.textContent;
                    for (let child of node.children) {
                        if (obj[child.nodeName] !== undefined) {
                            if (!Array.isArray(obj[child.nodeName])) obj[child.nodeName] = [obj[child.nodeName]];
                            obj[child.nodeName].push(nodeToObjInner(child));
                        } else obj[child.nodeName] = nodeToObjInner(child);
                    }
                    return obj;
                }

                return nodeToObjInner(root);
            }
        }

        function propertiesToObj(str) {
            const lines = str.split('\n');
            const result = {};
            lines.forEach(line => {
                line = line.trim();
                if (!line || line.startsWith('#')) return;
                const index = line.indexOf('=');
                if (index > 0) {
                    const key = line.substring(0, index).trim();
                    const value = line.substring(index + 1).trim();
                    const parts = key.split('.');
                    let current = result;
                    for (let i = 0; i < parts.length - 1; i++) {
                        if (!current[parts[i]] || typeof current[parts[i]] !== 'object') current[parts[i]] = {};
                        current = current[parts[i]];
                    }
                    current[parts[parts.length - 1]] = value;
                }
            });
            return result;
        }

        function objToProperties(obj, prefix = '') {
            let result = [];
            for (let key in obj) {
                if (obj.hasOwnProperty(key)) {
                    let fullKey = prefix ? `${prefix}.${key}` : key;
                    if (typeof obj[key] === 'object' && obj[key] !== null) result.push(objToProperties(obj[key], fullKey));
                    else result.push(`${fullKey}=${obj[key]}`);
                }
            }
            return result.join('\n');
        }

        function objToXml(obj) {
            try {
                if (typeof js2xml === 'undefined') throw new Error("xml-js library not loaded");

                // 使用 xml-js 专业库序列化
                const options = {compact: true, ignoreComment: true, spaces: 2};
                let xml = js2xml({root: obj}, options);

                // 如果用户期望没有外层根节点（跟原始输入一样），这里可以把外层根节点去掉
                if (xml.startsWith('<root>') && xml.endsWith('</root>')) {
                    xml = xml.replace(/<\/?root>/g, '').trim();
                    // 尝试恢复被误删的缩进
                    xml = formatXmlString(xml);
                }

                return xml;
            } catch (e) {
                console.warn('xml-js 序列化失败，使用基础兜底逻辑:', e);
                // 基础兜底逻辑
                let xml = '';

                function build(obj, name, depth = 0) {
                    const indent = '  '.repeat(depth);
                    if (Array.isArray(obj)) {
                        obj.forEach(item => build(item, name || 'item', depth));
                    } else if (typeof obj === 'object' && obj !== null) {
                        const keys = Object.keys(obj);
                        if (keys.length === 0) {
                            xml += `${indent}<${name}/>\n`;
                            return;
                        }
                        xml += `${indent}<${name}>\n`;
                        keys.forEach(key => build(obj[key], key, depth + 1));
                        xml += `${indent}</${name}>\n`;
                    } else {
                        const safeValue = String(obj).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        xml += `${indent}<${name}>${safeValue}</${name}>\n`;
                    }
                }

                Object.keys(obj).forEach(key => build(obj[key], key, 0));
                return `<?xml version="1.0" encoding="UTF-8"?>\n${xml.trim()}`;
            }
        }

        clearInputBtn.addEventListener('click', () => {
            inputText.value = '';
            outputText.value = currentDict.outputPlaceholder;
            currentDataObj = null;
        });

        copyBtn.addEventListener('click', async () => {
            const text = outputText.value;
            if (text === currentDict.outputPlaceholder || !text) return;
            try {
                if (window.dbxPlugin && window.dbxPlugin.clipboard) {
                    await window.dbxPlugin.clipboard.writeText(text);
                } else {
                    await navigator.clipboard.writeText(text);
                }
                showToast(currentDict.toastCopySuccess);
            } catch (e) {
                showToast(currentDict.toastCopyError, 'error');
            }
        });

        // 初始化
        renderLangMenu();
        applyI18n();
        outputText.value = currentDict.outputPlaceholder;
    });
</script>
