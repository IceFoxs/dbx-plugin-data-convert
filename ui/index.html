<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据格式互转工具</title>

    <!-- 引入核心依赖 (离线需将文件下载至本地) -->
    <script src="js-yaml.min.js"></script>
    <script src="json/index.js"></script>
    <script>
        if (typeof stringify !== 'function') {
            window.stringify = function(obj, options) {
                return JSON.stringify(obj, null, options && options.indent ? options.indent : 2);
            };
        }
    </script>

    <style>
        /* =========================================
           基于 DBX 设计令牌的主题样式
           优先使用 DBX 注入的 --color-* / --radius-*
           并保留浏览器默认渲染的兜底
           ========================================= */
        :root {
            /* 兜底变量 (如果不在 DBX 宿主中运行) */
            --color-background: #ffffff;
            --color-foreground: #09090b;
            --color-card: #ffffff;
            --color-border: #e4e4e7;
            --color-muted: #f4f4f5;
            --color-muted-foreground: #71717a;
            --color-primary: #18181b;
            --color-primary-foreground: #fafafa;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        /* 强制覆盖一些 DBX 变量名（DBX 的 --color-* 格式） */
        :root {
            --bg-base: var(--color-background);
            --bg-card: var(--color-card);
            --text-main: var(--color-foreground);
            --text-muted: var(--color-muted-foreground);
            --border-light: var(--color-border);
            --primary: var(--color-primary);
            --primary-hover: var(--color-primary);
            --primary-text: var(--color-primary-foreground);
            --accent-bg: var(--color-muted);
            --accent-hover: var(--color-border);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 顶部导航栏 */
        .topbar {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 0 1.5rem;
            height: 3.5rem;
            border-bottom: 1px solid var(--border-light);
            background-color: var(--bg-base);
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }
        .brand svg { color: var(--primary); }

        .nav-links {
            display: flex;
            gap: 0.25rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            white-space: nowrap;
            flex: 1;
            justify-content: center;
        }

        .nav-links a {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-md);
            transition: all 0.15s ease;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: var(--text-main);
            background-color: var(--accent-bg);
        }

        .nav-links a.active {
            color: var(--primary);
            background-color: var(--accent-bg);
        }

        .topbar-right { flex-shrink: 0; width: 4rem; }

        /* 主工作区 */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            overflow: hidden;
            gap: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* 顶部控制台 */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            background-color: var(--bg-card);
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            border: 1px solid var(--border-light);
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
            align-self: center;
        }

        .select-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
            position: relative;
        }

        /* --- 自定义下拉菜单 --- */
        .custom-select-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 100px;
            background-color: var(--accent-bg);
            border: 1px solid transparent;
            padding: 0.4rem 0.75rem;
            font-size: 0.85rem;
            border-radius: var(--radius-md);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s ease;
            user-select: none;
        }
        .custom-select-trigger:hover { background-color: var(--accent-hover); }
        .custom-select-trigger.active { border-color: var(--primary); outline: none; }
        .custom-select-trigger svg {
            width: 0.9rem;
            height: 0.9rem;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }
        .custom-select-trigger.active svg { transform: rotate(180deg); }

        .custom-select-options {
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) scaleY(0.95);
            min-width: 130px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            padding: 0.35rem;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transform-origin: top center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .custom-select-options.open {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scaleY(1);
        }
        .custom-option {
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--text-main);
            transition: background-color 0.1s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .custom-option:hover { background-color: var(--accent-hover); }
        .custom-option.selected {
            background-color: var(--accent-bg);
            color: var(--primary);
            font-weight: 600;
        }
        .custom-option.selected::after {
            content: '✓';
            font-size: 0.9rem;
        }

        /* 反向切换按钮 */
        .swap-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            background-color: var(--primary);
            border: none;
            color: var(--primary-text);
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0;
        }
        .swap-btn:hover {
            background-color: var(--primary);
            opacity: 0.9;
            transform: rotate(180deg) scale(1.05);
        }
        .swap-btn svg { width: 1.1rem; height: 1.1rem; }

        /* 左右编辑区网格 */
        .workspace-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            min-height: 0;
        }

        .pane {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-height: 0;
        }

        .pane-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            padding: 0 0.25rem;
        }

        .pane-title {
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-main);
        }
        .pane-title svg { color: var(--text-muted); }

        .pane-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* 编辑器容器 */
        .editor-container {
            flex: 1;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-card);
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .editor-container:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* 原生 Textarea */
        .textarea {
            width: 100%;
            height: 100%;
            padding: 1.25rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text-main);
            background-color: var(--bg-card);
            border: none;
            outline: none;
            resize: none;
            tab-size: 2;
        }

        /* 按钮 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .btn svg { width: 0.9rem; height: 0.9rem; flex-shrink: 0; }

        .btn-primary {
            background-color: var(--text-main);
            color: var(--bg-card);
            flex: 1;
            padding: 0.6rem;
            font-size: 0.875rem;
            font-weight: 600;
        }
        .btn-primary:hover { opacity: 0.85; }

        .btn-outline {
            background-color: transparent;
            border-color: var(--border-light);
            color: var(--text-muted);
        }
        .btn-outline:hover {
            background-color: var(--accent-bg);
            color: var(--text-main);
            border-color: var(--border-light);
        }

        /* 结果展示区头 */
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border-light);
            background-color: var(--accent-bg);
            flex-shrink: 0;
        }
        .result-header-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Toast 提示框 */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: none;
        }
        .toast {
            background-color: var(--text-main);
            color: var(--bg-card);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            transition: opacity 0.3s, transform 0.3s;
        }
        .toast.error { background-color: #ef4444; color: #fff; }
        .toast.hide { opacity: 0; transform: translateX(100%); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .workspace-grid { grid-template-columns: 1fr; }
            .topbar { flex-direction: column; height: auto; padding: 1rem; gap: 1rem; }
            .topbar-right { display: none; }
            .nav-links { flex-wrap: wrap; justify-content: center; }
            .toolbar { flex-direction: row; flex-wrap: wrap; border-radius: var(--radius-lg); padding: 1rem; width: 100%;}
            .main-container { padding: 1rem; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span data-i18n="brand">工具</span>
    </div>

    <nav class="nav-links" id="navLinks">
        <!-- data-i18n 对应键值翻译 -->
        <a data-src="yaml" data-tgt="json" data-i18n="navYamlJson">yaml转json</a>
        <a data-src="yaml" data-tgt="properties" data-i18n="navYamlProps">yaml转properties</a>
        <a data-src="json" data-tgt="properties" data-i18n="navJsonProps">json转properties</a>
        <a data-src="json" data-tgt="xml" data-i18n="navJsonXml">json转xml</a>
        <a data-src="xml" data-tgt="yaml" data-i18n="navXmlYaml">xml转yaml</a>
        <a data-src="json" data-tgt="yaml" data-i18n="navJsonYaml">json转yaml</a>
        <a data-src="yaml" data-tgt="xml" data-i18n="navYamlXml">yaml转xml</a>
    </nav>

    <div class="topbar-right"></div>
</header>

<main class="main-container">
    <!-- 顶部控制台 -->
    <div class="toolbar">
        <div class="select-group">
            <span data-i18n="fromLabel">从</span>
            <div class="custom-select" id="sourceSelect">
                <div class="custom-select-trigger">
                    <span class="label">JSON</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="custom-select-options">
                    <div class="custom-option selected" data-value="json">JSON</div>
                    <div class="custom-option" data-value="yaml">YAML</div>
                    <div class="custom-option" data-value="xml">XML</div>
                    <div class="custom-option" data-value="properties">Properties</div>
                </div>
            </div>
        </div>

        <button class="swap-btn" id="swapBtn" data-i18n-title="swapTitle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
        </button>

        <div class="select-group">
            <span data-i18n="toLabel">转为</span>
            <div class="custom-select" id="targetSelect">
                <div class="custom-select-trigger">
                    <span class="label">YAML</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="custom-select-options">
                    <div class="custom-option" data-value="json">JSON</div>
                    <div class="custom-option selected" data-value="yaml">YAML</div>
                    <div class="custom-option" data-value="xml">XML</div>
                    <div class="custom-option" data-value="properties">Properties</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 左右编辑区 -->
    <div class="workspace-grid">
        <!-- 左侧：输入区 -->
        <div class="pane">
            <div class="pane-header">
                <div class="pane-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    <span data-i18n="inputLabel">输入内容</span>
                </div>
                <div class="pane-actions">
                    <button class="btn btn-outline" id="formatInputBtn" data-i18n-title="formatBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/></svg>
                        <span data-i18n="formatBtn">格式化</span>
                    </button>
                    <button class="btn btn-outline" id="genMockBtn" data-i18n-title="mockBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        <span data-i18n="mockBtn">模拟数据</span>
                    </button>
                    <button class="btn btn-outline" id="clearInputBtn" data-i18n-title="clearBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </div>
            </div>

            <div class="editor-container">
                <textarea id="inputText" class="textarea" data-i18n-placeholder="inputPlaceholder"></textarea>
            </div>

            <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                <button class="btn btn-primary" id="convertBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                    <span data-i18n="convertBtn">执行转换</span>
                </button>
            </div>
        </div>

        <!-- 右侧：输出区 -->
        <div class="pane">
            <div class="pane-header">
                <div class="pane-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span data-i18n="outputLabel">输出结果</span>
                </div>
                <div class="pane-actions">
                    <button class="btn btn-outline" id="formatOutputBtn" data-i18n-title="formatBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/></svg>
                        <span data-i18n="formatBtn">格式化</span>
                    </button>
                    <button class="btn btn-outline" id="copyBtn" data-i18n-title="copyBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        <span data-i18n="copyBtn">复制</span>
                    </button>
                </div>
            </div>

            <div class="editor-container">
                <div class="result-header">
                    <span class="result-header-label" id="outputLabel">Result Output (YAML)</span>
                </div>
                <textarea id="outputText" class="textarea" data-i18n-placeholder="outputPlaceholder" style="background-color: var(--accent-bg);"></textarea>
            </div>
        </div>
    </div>
</main>

<div id="toastContainer" class="toast-container"></div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // =========================================
        // 1. 国际化 (I18n) 字典
        // =========================================
        const translations = {
            'zh-CN': {
                brand: '工具',
                navYamlJson: 'yaml转json',
                navYamlProps: 'yaml转properties',
                navJsonProps: 'json转properties',
                navJsonXml: 'json转xml',
                navXmlYaml: 'xml转yaml',
                navJsonYaml: 'json转yaml',
                navYamlXml: 'yaml转xml',
                fromLabel: '从',
                toLabel: '转为',
                swapTitle: '互换格式并将结果作为输入',
                inputLabel: '输入内容',
                outputLabel: '输出结果',
                formatBtn: '格式化',
                mockBtn: '模拟数据',
                clearBtn: '清空',
                convertBtn: '执行转换',
                copyBtn: '复制',
                inputPlaceholder: '// 在此输入或粘贴源数据...',
                outputPlaceholder: '等待操作...',
                toastMockSuccess: '已生成模拟数据并完成转换',
                toastMockError: '生成模拟数据失败',
                toastFormatInput: '输入格式化成功',
                toastFormatOutput: '输出格式化成功',
                toastFormatError: '格式化失败',
                toastConvertSuccess: '转换并格式化成功',
                toastConvertError: '转换失败',
                toastCopySuccess: '已复制到剪贴板',
                toastCopyError: '复制失败',
                toastEmptyInput: '请输入内容',
                toastSameFormat: '源格式与目标格式相同。',
                toastConvertSilentError: '转换出错: 请检查源格式是否正确'
            },
            'zh-TW': {
                brand: '工具',
                navYamlJson: 'yaml轉json',
                navYamlProps: 'yaml轉properties',
                navJsonProps: 'json轉properties',
                navJsonXml: 'json轉xml',
                navXmlYaml: 'xml轉yaml',
                navJsonYaml: 'json轉yaml',
                navYamlXml: 'yaml轉xml',
                fromLabel: '從',
                toLabel: '轉為',
                swapTitle: '互換格式並將結果作為輸入',
                inputLabel: '輸入內容',
                outputLabel: '輸出結果',
                formatBtn: '格式化',
                mockBtn: '模擬數據',
                clearBtn: '清空',
                convertBtn: '執行轉換',
                copyBtn: '複製',
                inputPlaceholder: '// 在此輸入或粘貼源數據...',
                outputPlaceholder: '等待操作...',
                toastMockSuccess: '已生成模擬數據並完成轉換',
                toastMockError: '生成模擬數據失敗',
                toastFormatInput: '輸入格式化成功',
                toastFormatOutput: '輸出格式化成功',
                toastFormatError: '格式化失敗',
                toastConvertSuccess: '轉換並格式化成功',
                toastConvertError: '轉換失敗',
                toastCopySuccess: '已複製到剪貼板',
                toastCopyError: '複製失敗',
                toastEmptyInput: '請輸入內容',
                toastSameFormat: '源格式與目標格式相同。',
                toastConvertSilentError: '轉換出錯: 請檢查源格式是否正確'
            },
            'en': {
                brand: 'Tools',
                navYamlJson: 'YAML to JSON',
                navYamlProps: 'YAML to Properties',
                navJsonProps: 'JSON to Properties',
                navJsonXml: 'JSON to XML',
                navXmlYaml: 'XML to YAML',
                navJsonYaml: 'JSON to YAML',
                navYamlXml: 'YAML to XML',
                fromLabel: 'From',
                toLabel: 'To',
                swapTitle: 'Swap formats and use result as input',
                inputLabel: 'Input',
                outputLabel: 'Output',
                formatBtn: 'Format',
                mockBtn: 'Mock',
                clearBtn: 'Clear',
                convertBtn: 'Convert',
                copyBtn: 'Copy',
                inputPlaceholder: '// Enter or paste source data here...',
                outputPlaceholder: 'Waiting for operation...',
                toastMockSuccess: 'Mock data generated and converted',
                toastMockError: 'Failed to generate mock data',
                toastFormatInput: 'Input formatted',
                toastFormatOutput: 'Output formatted',
                toastFormatError: 'Format failed',
                toastConvertSuccess: 'Converted and formatted',
                toastConvertError: 'Conversion failed',
                toastCopySuccess: 'Copied to clipboard',
                toastCopyError: 'Copy failed',
                toastEmptyInput: 'Please enter content',
                toastSameFormat: 'Source and target formats are the same.',
                toastConvertSilentError: 'Error: Please check source format'
            }
        };

        let currentLang = 'zh-CN';
        let currentTheme = 'light';

        // =========================================
        // 2. DBX 环境与 API 桥接
        // =========================================
        // 如果在 DBX 环境中，优先获取 DBX 提供的 API
        if (window.dbxPlugin) {
            try {
                await window.dbxPlugin.ready;
                if (window.dbxPlugin.locale) currentLang = window.dbxPlugin.locale;
                if (window.dbxPlugin.theme && window.dbxPlugin.theme.appearance) {
                    currentTheme = window.dbxPlugin.theme.appearance;
                }

                // 监听 DBX 环境变化（主题、语言）
                window.addEventListener('dbx-plugin-env', (event) => {
                    const env = event.detail;
                    if (env.locale) currentLang = env.locale;
                    if (env.theme && env.theme.appearance) {
                        currentTheme = env.theme.appearance;
                        // 强制刷新 CSS 变量或做额外处理（如果需要）
                        document.documentElement.setAttribute('data-dbx-theme', currentTheme);
                    }
                    applyI18n();
                });
            } catch (err) {
                console.warn('DBX 环境初始化异常', err);
            }
        } else {
            // 浏览器独立预览环境兜底
            const userLang = navigator.language || 'zh-CN';
            currentLang = translations[userLang] ? userLang : (userLang.startsWith('zh') ? 'zh-CN' : 'en');
            currentTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-dbx-theme', currentTheme);
        }

        // =========================================
        // 3. 应用国际化
        // =========================================
        function applyI18n() {
            if (!translations[currentLang]) currentLang = 'zh-CN';
            const dict = translations[currentLang];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (dict[key]) el.placeholder = dict[key];
            });

            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (dict[key]) el.title = dict[key];
            });

            updateOutputLabel();
        }

        // =========================================
        // 4. 业务逻辑 (不变)
        // =========================================
        function initCustomSelect(containerId) {
            const container = document.getElementById(containerId);
            const trigger = container.querySelector('.custom-select-trigger');
            const options = container.querySelector('.custom-select-options');
            const label = trigger.querySelector('.label');
            let currentValue = container.querySelector('.custom-option.selected').dataset.value;

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.custom-select-options').forEach(opt => {
                    if(opt !== options) opt.classList.remove('open');
                });
                document.querySelectorAll('.custom-select-trigger').forEach(tr => {
                    if(tr !== trigger) tr.classList.remove('active');
                });
                options.classList.toggle('open');
                trigger.classList.toggle('active');
            });

            container.querySelectorAll('.custom-option').forEach(opt => {
                opt.addEventListener('click', (e) => {
                    e.stopPropagation();
                    container.querySelectorAll('.custom-option').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    label.textContent = opt.textContent.trim();
                    options.classList.remove('open');
                    trigger.classList.remove('active');

                    const newVal = opt.dataset.value;
                    if (newVal !== currentValue) {
                        currentValue = newVal;
                        container.dispatchEvent(new CustomEvent('change', { detail: newVal }));
                    }
                });
            });

            return {
                getValue: () => currentValue,
                setValue: (val) => {
                    const targetOpt = container.querySelector(`.custom-option[data-value="${val}"]`);
                    if (targetOpt) {
                        container.querySelectorAll('.custom-option').forEach(o => o.classList.remove('selected'));
                        targetOpt.classList.add('selected');
                        label.textContent = targetOpt.textContent.trim();
                        currentValue = val;
                    }
                }
            };
        }

        const sourceSelect = initCustomSelect('sourceSelect');
        const targetSelect = initCustomSelect('targetSelect');

        document.addEventListener('click', () => {
            document.querySelectorAll('.custom-select-options').forEach(opt => opt.classList.remove('open'));
            document.querySelectorAll('.custom-select-trigger').forEach(tr => tr.classList.remove('active'));
        });

        const navLinks = document.querySelectorAll('#navLinks a');
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const swapBtn = document.getElementById('swapBtn');
        const convertBtn = document.getElementById('convertBtn');
        const clearInputBtn = document.getElementById('clearInputBtn');
        const genMockBtn = document.getElementById('genMockBtn');
        const copyBtn = document.getElementById('copyBtn');
        const outputLabel = document.getElementById('outputLabel');
        const formatInputBtn = document.getElementById('formatInputBtn');
        const formatOutputBtn = document.getElementById('formatOutputBtn');
        const toastContainer = document.getElementById('toastContainer');

        let sourceFormat = { value: sourceSelect.getValue() };
        let targetFormat = { value: targetSelect.getValue() };

        let currentDataObj = null;

        inputText.addEventListener('input', () => { currentDataObj = null; });
        outputText.addEventListener('input', () => {
            if (outputText.value.trim() === '' || outputText.value === translations[currentLang].outputPlaceholder) {
                currentDataObj = null;
            }
        });

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            toast.innerHTML = `<span>${message}</span>`;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                handleFormatChange(link.dataset.src, link.dataset.tgt);
            });
        });

        document.getElementById('sourceSelect').addEventListener('change', (e) => {
            sourceFormat.value = e.detail;
            updateOutputLabel();
            if (currentDataObj) {
                try {
                    inputText.value = serializeData(currentDataObj, sourceFormat.value);
                } catch (err) {
                    outputText.value = translations[currentLang].outputPlaceholder;
                }
            }
            doConvertSilent();
        });

        document.getElementById('targetSelect').addEventListener('change', (e) => {
            targetFormat.value = e.detail;
            updateOutputLabel();
            doConvertSilent();
        });

        swapBtn.addEventListener('click', () => {
            const temp = sourceFormat.value;
            sourceFormat.value = targetFormat.value;
            targetFormat.value = temp;

            sourceSelect.setValue(sourceFormat.value);
            targetSelect.setValue(targetFormat.value);

            const currentOutput = outputText.value;
            if (currentOutput && currentOutput !== translations[currentLang].outputPlaceholder && currentOutput !== translations[currentLang].toastSameFormat) {
                inputText.value = currentOutput;
                currentDataObj = null;
            }
            updateOutputLabel();
            doConvertSilent();
        });

        function updateOutputLabel() {
            outputLabel.textContent = `Result Output (${targetFormat.value.toUpperCase()})`;
        }

        function handleFormatChange(newSrc, newTgt) {
            sourceFormat.value = newSrc;
            targetFormat.value = newTgt;
            sourceSelect.setValue(newSrc);
            targetSelect.setValue(newTgt);
            updateOutputLabel();

            const raw = inputText.value.trim();
            if (raw && raw !== translations[currentLang].outputPlaceholder) {
                try {
                    try {
                        currentDataObj = parseData(raw, newSrc);
                        inputText.value = serializeData(currentDataObj, newSrc);
                    } catch (e) {
                        currentDataObj = null;
                    }
                } catch (err) {}
            }
            doConvertSilent();
        }

        function doConvertSilent() {
            const raw = inputText.value.trim();
            if (!raw || raw === translations[currentLang].outputPlaceholder) {
                outputText.value = translations[currentLang].outputPlaceholder;
                return;
            }

            const src = sourceFormat.value;
            const tgt = targetFormat.value;

            try {
                if (!currentDataObj) {
                    currentDataObj = parseData(raw, src);
                }
                outputText.value = serializeData(currentDataObj, tgt);
            } catch (err) {
                if (src === tgt) {
                    outputText.value = raw;
                } else {
                    outputText.value = translations[currentLang].toastConvertSilentError;
                    currentDataObj = null;
                }
            }
        }

        genMockBtn.addEventListener('click', () => {
            const src = sourceFormat.value;
            const tgt = targetFormat.value;

            currentDataObj = {
                id: 1001,
                title: "测试数据",
                author: {
                    name: "张三",
                    email: "zhangsan@example.com"
                },
                tags: ["admin", "editor", "viewer"],
                metadata: {
                    createdAt: "2023-10-27T10:00:00Z",
                    version: 1.2,
                    isActive: true
                }
            };

            try {
                inputText.value = serializeData(currentDataObj, src);
                outputText.value = serializeData(currentDataObj, tgt);
                showToast(translations[currentLang].toastMockSuccess);
            } catch (err) {
                showToast(translations[currentLang].toastMockError, 'error');
            }
        });

        formatInputBtn.addEventListener('click', () => {
            const raw = inputText.value.trim();
            if (!raw) return;
            try {
                if (sourceFormat.value === 'xml') {
                    inputText.value = formatXmlString(raw);
                } else {
                    const obj = parseData(raw, sourceFormat.value);
                    inputText.value = serializeData(obj, sourceFormat.value);
                    currentDataObj = obj;
                }
                showToast(translations[currentLang].toastFormatInput);
            } catch (err) {
                showToast(translations[currentLang].toastFormatError, 'error');
            }
        });

        formatOutputBtn.addEventListener('click', () => {
            const raw = outputText.value.trim();
            if (raw === translations[currentLang].outputPlaceholder || !raw) return;
            try {
                if (targetFormat.value === 'xml') {
                    outputText.value = formatXmlString(raw);
                } else {
                    const obj = parseData(raw, targetFormat.value);
                    outputText.value = serializeData(obj, targetFormat.value);
                }
                showToast(translations[currentLang].toastFormatOutput);
            } catch (err) {
                showToast(translations[currentLang].toastFormatError, 'error');
            }
        });

        function doConvert() {
            const raw = inputText.value.trim();
            if (!raw) {
                showToast(translations[currentLang].toastEmptyInput, 'error');
                return;
            }
            const src = sourceFormat.value, tgt = targetFormat.value;
            try {
                currentDataObj = parseData(raw, src);
                outputText.value = serializeData(currentDataObj, tgt);
                showToast(translations[currentLang].toastConvertSuccess);
            } catch (err) {
                outputText.value = `转换出错: ${err.message}`;
                currentDataObj = null;
                showToast(translations[currentLang].toastConvertError, 'error');
            }
        }

        convertBtn.addEventListener('click', doConvert);

        function parseData(text, format) {
            if (format === 'json') return JSON.parse(text);
            if (format === 'yaml') return jsyaml.load(text);
            if (format === 'xml') return xmlToObj(text);
            if (format === 'properties') return propertiesToObj(text);
            throw new Error("未知格式");
        }

        function serializeData(obj, format) {
            if (format === 'json') {
                try {
                    return window.stringify(obj, { indent: 2, maxLength: 80 });
                } catch (e) {
                    return JSON.stringify(obj, null, 2);
                }
            }
            if (format === 'yaml') return jsyaml.dump(obj);
            if (format === 'xml') return objToXml(obj);
            if (format === 'properties') return objToProperties(obj);
            throw new Error("未知格式");
        }

        function formatXmlString(xml) {
            let formatted = '';
            xml = xml.replace(/>\s*</g, '><').trim();
            let xmlDecl = '';
            const declMatch = xml.match(/^<\?xml.*?\?>/);
            if (declMatch) {
                xmlDecl = declMatch[0];
                xml = xml.replace(declMatch[0], '').trim();
            }
            const reg = /(>)(<)(\/*)/g;
            xml = xml.replace(reg, '$1\n$2$3');
            let pad = 0;
            xml.split('\n').forEach(node => {
                let indent = 0;
                if (node.match(/.+<\/\w[^>]*>$/)) indent = 0;
                else if (node.match(/^<\/\w/)) {
                    if (pad != 0) pad -= 1;
                } else if (node.match(/^<\w[^>]*[^\/]>.*$/)) indent = 1;
                let padding = '';
                for (let i = 0; i < pad; i++) padding += '  ';
                formatted += padding + node + '\n';
                pad += indent;
            });
            formatted = formatted.replace(/<\s+(\/?[^>]+)>/g, '<$1>');
            return (xmlDecl ? xmlDecl + '\n' : '') + formatted.trim();
        }

        function xmlToObj(xmlStr) {
            let cleanXml = xmlStr.trim();
            if (cleanXml.startsWith('<?xml')) cleanXml = cleanXml.replace(/<\?xml.*?\?>/, '').trim();
            if (!cleanXml.startsWith('<root>')) {
                const wrapped = `<root>${cleanXml}</root>`;
                const parser = new DOMParser();
                const doc = parser.parseFromString(wrapped, "text/xml");
                if (doc.querySelector('parsererror')) throw new Error("XML 格式错误");
                const root = doc.documentElement;
                const obj = {};
                for (let child of root.children) {
                    if (obj[child.nodeName] !== undefined) {
                        if (!Array.isArray(obj[child.nodeName])) obj[child.nodeName] = [obj[child.nodeName]];
                        obj[child.nodeName].push(nodeToObjInner(child));
                    } else obj[child.nodeName] = nodeToObjInner(child);
                }
                return obj;
            }
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(cleanXml, "text/xml");
            if (xmlDoc.querySelector('parsererror')) throw new Error("XML 格式错误");
            const root = xmlDoc.documentElement;
            return { [root.nodeName]: nodeToObjInner(root) };

            function nodeToObjInner(node) {
                const obj = {};
                if (node.children.length === 0) return node.textContent;
                for (let child of node.children) {
                    if (obj[child.nodeName] !== undefined) {
                        if (!Array.isArray(obj[child.nodeName])) obj[child.nodeName] = [obj[child.nodeName]];
                        obj[child.nodeName].push(nodeToObjInner(child));
                    } else obj[child.nodeName] = nodeToObjInner(child);
                }
                return obj;
            }
        }

        function propertiesToObj(str) {
            const lines = str.split('\n');
            const result = {};
            lines.forEach(line => {
                line = line.trim();
                if (!line || line.startsWith('#')) return;
                const index = line.indexOf('=');
                if (index > 0) {
                    const key = line.substring(0, index).trim();
                    const value = line.substring(index + 1).trim();
                    const parts = key.split('.');
                    let current = result;
                    for (let i = 0; i < parts.length - 1; i++) {
                        if (!current[parts[i]] || typeof current[parts[i]] !== 'object') current[parts[i]] = {};
                        current = current[parts[i]];
                    }
                    current[parts[parts.length - 1]] = value;
                }
            });
            return result;
        }

        function objToProperties(obj, prefix = '') {
            let result = [];
            for (let key in obj) {
                if (obj.hasOwnProperty(key)) {
                    let fullKey = prefix ? `${prefix}.${key}` : key;
                    if (typeof obj[key] === 'object' && obj[key] !== null) result.push(objToProperties(obj[key], fullKey));
                    else result.push(`${fullKey}=${obj[key]}`);
                }
            }
            return result.join('\n');
        }

        function objToXml(obj, rootName = 'root') {
            let xml = '';
            function build(obj, name, depth = 0) {
                const indent = '  '.repeat(depth);
                if (Array.isArray(obj)) {
                    obj.forEach(item => build(item, name || 'item', depth));
                } else if (typeof obj === 'object' && obj !== null) {
                    if (rootName === 'root' && depth === 0) {
                        Object.keys(obj).forEach(key => build(obj[key], key, 0));
                    } else {
                        const keys = Object.keys(obj);
                        if (keys.length === 0) {
                            xml += `${indent}<${name}/>\n`;
                            return;
                        }
                        const isFlat = keys.every(k => typeof obj[k] !== 'object' || obj[k] === null);
                        if (isFlat) {
                            let innerXml = keys.map(k => {
                                const safeValue = String(obj[k]).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                                return `<${k}>${safeValue}</${k}>`;
                            }).join('');
                            xml += `${indent}<${name}>${innerXml}</${name}>\n`;
                        } else {
                            xml += `${indent}<${name}>\n`;
                            keys.forEach(key => build(obj[key], key, depth + 1));
                            xml += `${indent}</${name}>\n`;
                        }
                    }
                } else {
                    const safeValue = String(obj).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    xml += `${indent}<${name}>${safeValue}</${name}>\n`;
                }
            }

            if (Array.isArray(obj)) {
                obj.forEach((item, index) => build(item, `item${index}`, 0));
            } else if (typeof obj === 'object' && obj !== null) {
                Object.keys(obj).forEach(key => build(obj[key], key, 0));
            } else {
                xml += `<value>${obj}</value>\n`;
            }
            return `<?xml version="1.0" encoding="UTF-8"?>\n${xml.trim()}`;
        }

        clearInputBtn.addEventListener('click', () => {
            inputText.value = '';
            outputText.value = translations[currentLang].outputPlaceholder;
            currentDataObj = null;
        });

        copyBtn.addEventListener('click', async () => {
            const text = outputText.value;
            if (text === translations[currentLang].outputPlaceholder || !text) return;
            try {
                if (window.dbxPlugin && window.dbxPlugin.clipboard) {
                    await window.dbxPlugin.clipboard.writeText(text);
                } else {
                    await navigator.clipboard.writeText(text);
                }
                showToast(translations[currentLang].toastCopySuccess);
            } catch (e) {
                showToast(translations[currentLang].toastCopyError, 'error');
            }
        });

        // 初始化页面文本
        applyI18n();
        outputText.value = translations[currentLang].outputPlaceholder;
    });
</script>
