name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # 用 npm ci：锁文件和 package.json 对不上就立刻失败，不静默改锁
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      # 一次跑完 20 个纯函数用例（分隔符解析、时间、二维码、统计、i18n、资源引用……）。
      # 以前只跑前三个，其余十几个在 CI 里从来没被检查过
      - name: Pure-function suites
        run: npm test

      - name: UI smoke test
        run: node tests/ui.smoke.js

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json ok')"

      - name: Check inline script syntax
        run: |
          node -e "
            const fs = require('fs');
            // 先摘掉 HTML 注释：注释里出现的 <script> 只是文字，不是要执行的代码，
            // 之前这里没摘，把注释尾巴当内联脚本解析，报了 Invalid or unexpected token
            const html = fs.readFileSync('ui/index.html', 'utf8').replace(/<!--[\s\S]*?-->/g, '');
            const blocks = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
            blocks.forEach((code, i) => {
              try {
                new Function(code);
              } catch (err) {
                throw new Error('第 ' + (i + 1) + ' 段内联脚本语法错误：' + err.message);
              }
            });
            console.log('inline scripts ok:', blocks.length);
          "

      # 页面用普通 <script> 加载，任何一个文件混进 ES module 语法都会让整页白屏
      - name: Check UI assets are classic scripts
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) => {
              const full = path.join(dir, e.name);
              return e.isDirectory() ? walk(full) : (e.name.endsWith('.js') ? [full] : []);
            });
            const files = walk('ui/js');
            files.forEach((f) => {
              const src = fs.readFileSync(f, 'utf8');
              if (/^\s*(export|import)\s/m.test(src)) {
                throw new Error(f + ' 使用了 ES module 语法，但页面用 <script> 加载');
              }
            });
            console.log('classic scripts ok:', files.length);
          "
