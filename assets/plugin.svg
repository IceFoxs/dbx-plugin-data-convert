<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- 深邃蓝黑渐变底 -->
    <linearGradient id="darkBg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 高亮青蓝渐变 -->
    <linearGradient id="cyanGrad" x1="20" y1="16" x2="108" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <!-- 1. 深色渐变底板 -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#darkBg)"/>
  <!-- 边缘微光描边 -->
  <rect x="2.5" y="2.5" width="123" height="123" rx="27.5" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- 2. 上半部图形 -->
  <g transform="translate(0, -4)">
    <!-- 左侧文档 -->
    <path d="M28 28a6 6 0 0 1 6-6h16l10 10v36a6 6 0 0 1-6 6H34a6 6 0 0 1-6-6V28z"
          fill="#ffffff" fill-opacity="0.05" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M50 22v10h10" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M38 44h14M38 54h20" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- 右侧文档 -->
    <path d="M74 28a6 6 0 0 1 6-6h16l10 10v36a6 6 0 0 1-6 6H80a6 6 0 0 1-6-6V28z"
          fill="#ffffff" fill-opacity="0.05" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M96 22v10h10" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M84 44h14M84 54h20" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- 中间数据流 -->
    <g stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M68 74H52"/>
      <path d="M58 68l-6 6 6 6"/>

      <path d="M60 38h16"/>
      <path d="M70 32l6 6-6 6"/>
    </g>
  </g>

  <!-- 3. 下半部纯白文字 -->
  <text x="64" y="100"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif"
        font-size="20"
        font-weight="900"
        fill="#ffffff"
        letter-spacing="2">转换工具</text>

  <text x="64" y="114"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="8"
        font-weight="800"
        fill="#00f2fe"
        letter-spacing="2">CONVERTER</text>
</svg>