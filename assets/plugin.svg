<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- 背景微渐变：白 -> 极浅冷灰 -->
    <linearGradient id="bgLight" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>

    <!-- 主色渐变：科技蓝 -> 紫 -->
    <linearGradient id="accent" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- 网格图案 -->
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#2563eb" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>

    <!-- 光晕 -->
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- 文档填充 -->
    <linearGradient id="docFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5ff"/>
    </linearGradient>
  </defs>

  <!-- 白色圆角底板 -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgLight)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#grid)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#glow)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="53.25" stroke="url(#accent)" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- 图形区 -->
  <g transform="translate(0,-12)">
    <!-- 左侧文档 -->
    <g>
      <path d="M56 56a10 10 0 0 1 10-10h30l18 18v60a10 10 0 0 1-10 10H66a10 10 0 0 1-10-10V56z"
            fill="url(#docFill)" stroke="url(#accent)" stroke-width="4"/>
      <path d="M96 46v18h18" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <line x1="72" y1="86" x2="98" y2="86" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
      <line x1="72" y1="102" x2="104" y2="102" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
      <line x1="72" y1="118" x2="90" y2="118" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>
    </g>

    <!-- 右侧文档 -->
    <g>
      <path d="M144 56a10 10 0 0 1 10-10h30l18 18v60a10 10 0 0 1-10 10h-38a10 10 0 0 1-10-10V56z"
            fill="url(#docFill)" stroke="url(#accent)" stroke-width="4"/>
      <path d="M184 46v18h18" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <line x1="160" y1="86" x2="186" y2="86" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
      <line x1="160" y1="102" x2="192" y2="102" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
      <line x1="160" y1="118" x2="178" y2="118" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>
    </g>

    <!-- 中间双向数据流箭头 -->
    <g stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- 上：右 -> 左 -->
      <path d="M152 74h-30"/>
      <path d="M132 64l-10 10 10 10"/>
      <!-- 下：左 -> 右 -->
      <path d="M104 146h30"/>
      <path d="M124 136l10 10-10 10"/>
    </g>

    <!-- 数据流光点 -->
    <circle cx="120" cy="74" r="3.5" fill="#2563eb"/>
    <circle cx="136" cy="146" r="3.5" fill="#7c3aed"/>
    <circle cx="112" cy="74" r="2" fill="#60a5fa" opacity="0.8"/>
    <circle cx="144" cy="146" r="2" fill="#a78bfa" opacity="0.8"/>
  </g>

  <!-- 文字 -->
  <text x="128" y="198"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif"
        font-size="28"
        font-weight="700"
        fill="#1e293b"
        letter-spacing="3">转换工具</text>

  <text x="128" y="224"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="12"
        font-weight="600"
        fill="#6366f1"
        letter-spacing="3.5">DATA CONVERTER</text>
</svg>